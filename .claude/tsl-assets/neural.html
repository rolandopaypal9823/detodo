<!-- ==== DECORATIVO (aislado): red neuronal + barra de carga + título por letra ==== -->
<script>
(function(){
  /* ----- Red neuronal: motor reutilizable (claro y oscuro) ----- */
  try{
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* sin hover = touch: la red se mueve sola, no espera al mouse */
    var noHover = !(window.matchMedia && window.matchMedia("(hover: hover)").matches);

    function crearRed(canvas, opt){
      if(!canvas) return null;
      var ctx=canvas.getContext("2d");
      var dpr=Math.min(window.devicePixelRatio||1, 2);
      var C=opt.node, A=opt.accent||"255,102,2";
      var LINK=opt.link||150, DENS=opt.dens||17000, MAXN=opt.maxn||140, MINN=opt.minn||24;
      var rand=function(a,b){return Math.random()*(b-a)+a;};
      var w=0,h=0,nodes=[],edges=[],signals=[],glows=[],rt,visible=true,raf=null;
      var probe={x:-9999,y:-9999}, auto={x:0,y:0,tx:0,ty:0}, lastSpawn=0;

      function build(){
        var r=canvas.getBoundingClientRect();
        w=Math.max(1,Math.round(opt.fixed?innerWidth:r.width));
        h=Math.max(1,Math.round(opt.fixed?innerHeight:r.height));
        canvas.width=w*dpr; canvas.height=h*dpr;
        if(opt.fixed){ canvas.style.width=w+"px"; canvas.style.height=h+"px"; }
        ctx.setTransform(dpr,0,0,dpr,0,0);
        var count=Math.max(MINN, Math.min(MAXN, Math.round(w*h/DENS)));
        nodes=[];
        for(var i=0;i<count;i++){var x=Math.random()*w,y=Math.random()*h;
          nodes.push({x:x,y:y,bx:x,by:y,r:rand(1,2.1),flash:0,nbr:[]});}
        edges=[];
        for(var a=0;a<nodes.length;a++){for(var b=a+1;b<nodes.length;b++){
          var dx=nodes[a].bx-nodes[b].bx,dy=nodes[a].by-nodes[b].by,d=Math.hypot(dx,dy);
          if(d<LINK){edges.push([a,b,d]);nodes[a].nbr.push(b);nodes[b].nbr.push(a);}}}
        glows=[];
        for(var k=0;k<3;k++) glows.push({x:rand(.18,.82)*w,y:rand(.06,.6)*h,r:rand(300,480),ph:Math.random()*6.28,sp:rand(.05,.12)});
        signals=[];
        auto.x=auto.tx=w*0.5; auto.y=auto.ty=h*0.45;
      }

      function spawnFrom(mx,my){
        if(!nodes.length || signals.length>(opt.maxsig||28)) return;
        var best=-1,bd=1e9;
        for(var i=0;i<nodes.length;i++){var d=Math.hypot(nodes[i].x-mx,nodes[i].y-my); if(d<bd){bd=d;best=i;}}
        if(best<0 || bd>220) return;
        var nb=nodes[best].nbr; if(!nb.length) return;
        signals.push({from:best,to:nb[(Math.random()*nb.length)|0],p:0,sp:rand(.012,.024),gen:0});
      }

      function step(){
        raf=requestAnimationFrame(step);
        if(!visible) return;
        /* modo autónomo: un foco que deambula lento y dispara solo */
        if(opt.autoplay){
          if(Math.hypot(auto.tx-auto.x,auto.ty-auto.y)<28){ auto.tx=rand(.1,.9)*w; auto.ty=rand(.1,.9)*h; }
          auto.x+=(auto.tx-auto.x)*0.006; auto.y+=(auto.ty-auto.y)*0.006;
          probe.x=auto.x; probe.y=auto.y;
          var now=performance.now();
          if(now-lastSpawn>(opt.autorate||1500)){ spawnFrom(probe.x,probe.y); lastSpawn=now; }
        }
        ctx.clearRect(0,0,w,h);
        for(var g=0;g<glows.length;g++){ var G=glows[g]; G.ph+=G.sp*0.02;
          var gx=G.x+Math.cos(G.ph)*40, gy=G.y+Math.sin(G.ph*1.3)*30;
          var rg=ctx.createRadialGradient(gx,gy,0,gx,gy,G.r);
          rg.addColorStop(0,"rgba("+C+","+(opt.glow||0.05)+")"); rg.addColorStop(1,"rgba("+C+",0)");
          ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(gx,gy,G.r,0,6.2832); ctx.fill(); }
        for(var n0=0;n0<nodes.length;n0++){ if(nodes[n0].flash>0) nodes[n0].flash-=0.035; }
        var R=opt.reach||175;
        for(var e=0;e<edges.length;e++){ var Ae=nodes[edges[e][0]],Be=nodes[edges[e][1]];
          var mx=(Ae.x+Be.x)/2,my=(Ae.y+Be.y)/2, md=Math.hypot(probe.x-mx,probe.y-my);
          var al=(opt.line||0.055)*(1-edges[e][2]/LINK); if(md<R) al+=(opt.lineHot||0.18)*(1-md/R);
          ctx.strokeStyle="rgba("+C+","+al.toFixed(3)+")"; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(Ae.x,Ae.y); ctx.lineTo(Be.x,Be.y); ctx.stroke(); }
        for(var n=0;n<nodes.length;n++){ var N=nodes[n]; var md2=Math.hypot(probe.x-N.x,probe.y-N.y);
          var near=md2<R?(1-md2/R):0, fl=Math.max(near,N.flash);
          ctx.fillStyle="rgba("+C+","+((opt.dot||0.11)+fl*0.55).toFixed(3)+")";
          ctx.beginPath(); ctx.arc(N.x,N.y,N.r+fl*1.6,0,6.2832); ctx.fill();
          if(fl>0.15){ var rr=12+fl*16, hg=ctx.createRadialGradient(N.x,N.y,0,N.x,N.y,rr);
            hg.addColorStop(0,"rgba("+A+","+(fl*0.42).toFixed(3)+")"); hg.addColorStop(1,"rgba("+A+",0)");
            ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(N.x,N.y,rr,0,6.2832); ctx.fill(); } }
        for(var i=signals.length-1;i>=0;i--){ var s=signals[i]; s.p+=s.sp;
          var sa=nodes[s.from],sb=nodes[s.to]; if(!sa||!sb){signals.splice(i,1);continue;}
          var x=sa.x+(sb.x-sa.x)*s.p, y=sa.y+(sb.y-sa.y)*s.p;
          var pg=ctx.createRadialGradient(x,y,0,x,y,7);
          pg.addColorStop(0,"rgba(255,142,44,0.95)"); pg.addColorStop(.4,"rgba("+A+",0.55)"); pg.addColorStop(1,"rgba("+A+",0)");
          ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(x,y,7,0,6.2832); ctx.fill();
          ctx.fillStyle="rgba(217,84,0,0.95)"; ctx.beginPath(); ctx.arc(x,y,1.6,0,6.2832); ctx.fill();
          if(s.p>=1){ sb.flash=1; signals.splice(i,1);
            if(s.gen<3 && Math.random()<0.72){ var nb=sb.nbr.filter(function(j){return j!==s.from;});
              if(nb.length) signals.push({from:s.to,to:nb[(Math.random()*nb.length)|0],p:0,sp:s.sp,gen:s.gen+1}); } } }
      }

      build();
      addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(build,180);});
      /* solo dibuja si la sección está a la vista (ahorra batería) */
      if(!opt.fixed && window.IntersectionObserver){
        visible=false;
        new IntersectionObserver(function(en){
          visible=en[0].isIntersecting;
          if(visible && Math.abs(canvas.getBoundingClientRect().height-h)>4) build();
        },{rootMargin:"120px"}).observe(canvas);
      }
      step();
      return {
        pointer:function(cx,cy){
          if(opt.autoplay) return;
          var r=canvas.getBoundingClientRect();
          probe.x=opt.fixed?cx:cx-r.left; probe.y=opt.fixed?cy:cy-r.top;
          var now=performance.now();
          if(now-lastSpawn>110){ spawnFrom(probe.x,probe.y); lastSpawn=now; }
        }
      };
    }

    if(!reduce){
      var redes=[];
      /* fondo global sobre secciones blancas → nodos navy */
      var g=crearRed(document.getElementById("neuralbg"), {
        fixed:true, node:"12,52,82", autoplay:noHover,
        maxn: noHover?60:140, dens: noHover?26000:17000, autorate:1700
      });
      if(g) redes.push(g);
      /* una red propia dentro de cada sección navy → nodos claros */
      var zonas=document.querySelectorAll(".section--navy, .trust--navy");
      for(var z=0;z<zonas.length;z++){
        var cv=document.createElement("canvas");
        cv.className="neural-local"; cv.setAttribute("aria-hidden","true");
        zonas[z].insertBefore(cv, zonas[z].firstChild);
        var r=crearRed(cv, {
          node:"173,203,227", accent:"255,140,60", autoplay:noHover,
          dens: noHover?30000:20000, maxn: noHover?42:70, minn:16,
          line:0.11, lineHot:0.30, dot:0.30, glow:0.09, maxsig:14, autorate:1900
        });
        if(r) redes.push(r);
      }
      /* el mouse activa; el touch NO (en touch ya se mueve solo) */
      if(!noHover){
        addEventListener("mousemove",function(e){
          for(var i=0;i<redes.length;i++) redes[i].pointer(e.clientX,e.clientY);
        },{passive:true});
      }
    }
  }catch(err){ if(window.console) console.warn("neural bg:", err); }

  /* ----- Barra de carga ----- */
  try{
    var bar=document.getElementById("loadbar");
    if(bar){ var fill=bar.querySelector(".lf");
      requestAnimationFrame(function(){requestAnimationFrame(function(){ if(fill) fill.style.width="100%"; });});
      setTimeout(function(){bar.classList.add("done");},1300); }
  }catch(err){ if(window.console) console.warn("loadbar:", err); }

  /* ----- Título del hero letra por letra (palabras indivisibles, respeta <br>) ----- */
  try{
    var h1=document.getElementById("heroTitle");
    var reduce2=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(h1 && !reduce2){
      var frag=document.createDocumentFragment(); var idx=0;
      Array.prototype.slice.call(h1.childNodes).forEach(function(node){
        if(node.nodeType===1 && node.tagName==="BR"){ frag.appendChild(document.createElement("br")); return; }
        var isKey = node.nodeType===1 && node.classList && node.classList.contains("shimmer");
        var tokens = node.textContent.split(/(\s+)/);
        tokens.forEach(function(tok){
          if(!tok) return;
          if(/^\s+$/.test(tok)){ frag.appendChild(document.createTextNode(" ")); return; }
          var word=document.createElement("span"); word.className="word";
          for(var ci=0;ci<tok.length;ci++){
            var sp=document.createElement("span");
            sp.className="ltr"+(isKey?" shimmer":""); sp.textContent=tok[ci];
            sp.style.transitionDelay=(idx*24)+"ms";
            word.appendChild(sp); idx++;
          }
          frag.appendChild(word);
        });
      });
      h1.textContent=""; h1.appendChild(frag);
      requestAnimationFrame(function(){requestAnimationFrame(function(){h1.classList.add("lit");});});
    } else if(h1){ h1.classList.add("lit"); }
  }catch(err){ if(window.console) console.warn("hero type:", err); }
})();
</script>
