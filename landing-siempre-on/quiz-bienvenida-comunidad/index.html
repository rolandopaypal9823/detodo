<body>

<!-- ═══════════ DESDE ACÁ EMPIEZA LO QUE VA EN EL CUSTOM CODE DE GHL ═══════════ -->
<!-- QUIZ DE BIENVENIDA · COMUNIDAD PRODUCTIVA
     Circuito: compra → n8n → FunnelChat (plantilla de bienvenida con este link) → este quiz.
     El link que manda FunnelChat lleva los datos del contacto en la URL:
       ?nombre={{nombre}}&telefono={{telefono}}&email={{email}}&cid={{id del contacto}}
     Al terminar, las respuestas y el resultado (califica, nivel, perfil) se mandan a n8n (CONFIG.WEBHOOK_URL).
     Califica → invitación a una sesión con un asesor (video + agenda de Calendly adentro de la página; si agenda, avisa a n8n).
     No califica → libro Hackea tu cerebro. -->

<!-- tipografías: se piden sin frenar la página -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" media="print" onload="this.media='all'">

<style>
:root{
  --q-navy:#0C3452; --q-navy-deep:#081F33; --q-orange:#FF6602; --q-orange-deep:#E55A00; --q-orange-soft:rgba(255,102,2,0.10);
  --q-bg:#F4F6FA; --q-card:#FFFFFF; --q-line:#E2E8F0; --q-ink:#0C3452; --q-ink-mute:#5A6B7E; --q-ok:#1E8E5A;
  --q-font-h:'Montserrat', sans-serif; --q-font-b:'Open Sans', sans-serif; --q-ease:cubic-bezier(0.22,1,0.36,1);
}
html, body{ margin:0; padding:0; background:var(--q-bg); }
.q-page, .q-page *, .q-page *::before, .q-page *::after{ box-sizing:border-box; }
.q-page{ font-family:var(--q-font-b); color:var(--q-ink); -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; }
.q-page p{ margin:0; }
:where(.q-page) button{ font:inherit; }
.q-page :focus-visible{ outline:3px solid var(--q-orange); outline-offset:3px; }
::selection{ background:rgba(255,102,2,0.22); }

/* ═══ ARRIBA · logo + "tu mapa" que se completa ═══ */
.q-top{ background:var(--q-navy); color:#fff; padding:14px 18px 16px; }
.q-top__in{ max-width:560px; margin:0 auto; }
.q-top__fila{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.q-top__logo svg{ height:40px !important; width:auto !important; max-width:none !important; display:block; }
@media (max-width:400px){ .q-top__logo svg{ height:34px !important; } }
.q-top__paso{ font-family:var(--q-font-h); font-size:0.74rem; font-weight:600; letter-spacing:0.08em; color:rgba(255,255,255,0.75); }
.q-mapa{ display:flex; gap:6px; margin-top:12px; }
.q-mapa__pieza{ flex:1; min-width:0; }
.q-mapa__barra{ height:6px; border-radius:3px; background:rgba(255,255,255,0.14); overflow:hidden; }
.q-mapa__barra i{ display:block; height:100%; width:0; background:var(--q-orange); border-radius:3px; transition:width .35s var(--q-ease); }
.q-mapa__nom{ display:block; font-family:var(--q-font-h); font-size:0.58rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-mapa__pieza.is-lista .q-mapa__nom{ color:#fff; }

/* ═══ PANTALLA ═══ */
.q-main{ flex:1; width:100%; max-width:560px; margin:0 auto; padding:26px 18px 40px; }
.q-pantalla{ animation:q-entra .32s var(--q-ease) both; }
@keyframes q-entra{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .q-pantalla{ animation:none; } .q-mapa__barra i{ transition:none; } }
.q-seccion{ display:inline-block; font-family:var(--q-font-h); font-size:0.68rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--q-orange-deep); margin-bottom:10px; }
.q-escena{ font-family:var(--q-font-h); font-size:1.28rem; font-weight:700; line-height:1.3; letter-spacing:-0.01em; margin:0 0 8px !important; }
.q-pregunta{ font-family:var(--q-font-h); font-size:1.32rem; font-weight:700; line-height:1.28; letter-spacing:-0.01em; margin:0 0 18px !important; }
.q-escena + .q-pregunta{ font-size:0.98rem; font-weight:600; color:var(--q-ink-mute); margin-top:6px !important; }
.q-ayuda{ font-size:0.9rem; color:var(--q-ink-mute); margin:-10px 0 16px !important; }

.q-opc{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--q-card); border:1.5px solid var(--q-line); border-radius:14px; padding:15px 16px; margin:0 0 10px; cursor:pointer; color:var(--q-ink); font-size:1rem; line-height:1.42; transition:border-color .15s, background-color .15s, transform .15s; -webkit-tap-highlight-color:transparent; }
@media (hover:hover){ .q-opc:hover{ border-color:rgba(255,102,2,0.55); } }
.q-opc:active{ transform:scale(0.985); }
.q-opc.is-sel{ border-color:var(--q-orange); background:var(--q-orange-soft); }
.q-opc__marca{ flex:none; width:22px; height:22px; border-radius:50%; border:2px solid #B8C3CF; margin-left:auto; position:relative; }
.q-opc--multi .q-opc__marca{ border-radius:6px; }
.q-opc.is-sel .q-opc__marca{ border-color:var(--q-orange); background:var(--q-orange); }
.q-opc.is-sel .q-opc__marca::after{ content:''; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.q-opc__t{ flex:1; }

.q-input{ width:100%; font:inherit; font-size:16px; color:var(--q-ink); background:var(--q-card); border:1.5px solid var(--q-line); border-radius:14px; padding:15px 16px; margin:0 0 14px; }
.q-input:focus{ border-color:var(--q-orange); outline:none; box-shadow:0 0 0 3px var(--q-orange-soft); }

.q-btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:50px; background:var(--q-orange); color:#fff !important; font-family:var(--q-font-h); font-size:1.02rem; font-weight:700; letter-spacing:0.02em; padding:17px 22px; cursor:pointer; text-decoration:none; box-shadow:0 8px 26px rgba(255,102,2,0.32); transition:transform .15s, opacity .15s; }
.q-btn:active{ transform:scale(0.97); }
.q-btn[disabled]{ opacity:.4; cursor:not-allowed; box-shadow:none; }
.q-btn svg{ width:18px; height:18px; }
.q-link{ display:block; margin:12px auto 0; background:none; border:0; color:var(--q-ink-mute); font-size:0.92rem; text-decoration:underline; cursor:pointer; }
.q-atras{ display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:6px 0; margin:0 0 14px; color:var(--q-ink-mute); font-family:var(--q-font-h); font-size:0.82rem; font-weight:600; cursor:pointer; }
.q-atras svg{ width:14px; height:14px; }

/* frase para marcar si te identificás */
.q-frase{ position:relative; background:var(--q-card); border:1px solid var(--q-line); border-radius:18px; padding:24px 20px 20px; margin:14px 0 16px !important; font-family:var(--q-font-h); font-size:1.2rem; font-weight:700; line-height:1.38; color:var(--q-ink); text-align:left !important; box-shadow:0 10px 30px rgba(12,52,82,0.06); }
.q-frase::before{ content:'“'; position:absolute; top:-16px; left:16px; font-family:Georgia, serif; font-size:3.4rem; line-height:1; color:var(--q-orange); }
.q-pregunta.q-pregunta--chica{ font-size:0.98rem; font-weight:600; color:var(--q-ink-mute); margin:0 0 12px !important; }
.q-ident{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.q-ident .q-opc{ justify-content:center; text-align:center; padding:16px 6px; margin:0; font-family:var(--q-font-h); font-weight:700; font-size:0.92rem; line-height:1.25; }
.q-ident .q-opc__t{ flex:none; }
/* escala del 1 al 10 */
.q-escala{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.q-escala .q-opc{ justify-content:center; padding:0; height:54px; margin:0; font-family:var(--q-font-h); font-weight:800; font-size:1.2rem; }
.q-escala .q-opc__t{ flex:none; }
.q-escala .q-opc.is-sel{ background:var(--q-orange); color:#fff; }
.q-escala__ext{ display:flex; justify-content:space-between; gap:12px; font-size:0.84rem; color:var(--q-ink-mute); margin-top:10px; }
@media (min-width:520px){ .q-escala{ grid-template-columns:repeat(10,minmax(0,1fr)); } }
/* un dato entre preguntas */
.q-dato{ background:var(--q-navy); color:#fff; border-radius:18px; padding:22px 20px; margin:0 0 18px; }
.q-dato .q-chip{ background:rgba(255,102,2,0.18); color:#FF8A3D; }
.q-dato h2{ font-family:var(--q-font-h); font-size:1.3rem; font-weight:800; line-height:1.25; margin:0 0 10px; text-align:left !important; }
.q-dato p{ font-size:1.02rem; line-height:1.55; color:rgba(255,255,255,0.88); margin:0 !important; text-align:left !important; }
/* agenda de Calendly adentro del quiz */
.q-agenda{ height:700px; min-width:320px; margin:14px 0 0; border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--q-line); }
.q-agenda[hidden], .q-agendado[hidden], .q-agenda-alt[hidden]{ display:none !important; }
.q-agendado{ display:flex; gap:10px; align-items:center; background:#E9F7EF; border:1px solid #BFE6CF; color:#145A39; border-radius:14px; padding:14px 16px; margin:14px 0 0; font-weight:600; line-height:1.4; }
.q-res .q-agenda-alt{ text-align:center !important; margin:8px 0 0 !important; }

/* intro */
.q-intro{ text-align:center; padding-top:12px; }
.q-intro h1, .q-intro p, .q-armando h2, .q-otra, .q-inv__micro{ text-align:center !important; }
.q-intro h1{ font-family:var(--q-font-h); font-size:1.85rem; font-weight:800; line-height:1.15; letter-spacing:-0.02em; margin:6px 0 12px; }
.q-intro h1 em{ font-style:normal; color:var(--q-orange); }
.q-intro p.q-intro__txt{ font-size:1.05rem; line-height:1.5; color:#2a3f54; margin:0 auto 24px !important; max-width:26em; }
.q-intro__micro{ font-size:0.86rem; color:var(--q-ink-mute); margin-top:12px !important; }
.q-escalon-mini{ display:flex; align-items:flex-end; justify-content:center; gap:6px; height:74px; margin:4px auto 18px; }
.q-escalon-mini span{ width:46px; border-radius:8px 8px 3px 3px; background:#D7DEE7; }
.q-escalon-mini span:nth-child(1){ height:30px; background:var(--q-orange); }
.q-escalon-mini span:nth-child(2){ height:50px; }
.q-escalon-mini span:nth-child(3){ height:72px; }

/* armando el mapa */
.q-armando{ text-align:center; padding-top:40px; }
.q-armando h2{ font-family:var(--q-font-h); font-size:1.3rem; font-weight:700; margin:0 0 20px; }
.q-armando ul{ list-style:none; padding:0; margin:0 auto; max-width:280px; text-align:left; }
.q-armando li{ display:flex; align-items:center; gap:10px; font-family:var(--q-font-h); font-weight:600; font-size:0.98rem; color:var(--q-ink-mute); padding:8px 0; opacity:.35; transition:opacity .25s; }
.q-armando li.is-ok{ opacity:1; color:var(--q-ink); }
.q-armando li b{ width:24px; height:24px; border-radius:50%; background:var(--q-line); color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.8rem; }
.q-armando li.is-ok b{ background:var(--q-ok); }

/* ═══ RESULTADO ═══ */
.q-res__kicker{ font-family:var(--q-font-h); font-size:0.7rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--q-orange-deep); }
.q-res h1, .q-res p, .q-card h2, .q-inv h2, .q-inv p:not(.q-inv__micro), .q-escena, .q-pregunta, .q-ayuda, .q-vemos li{ text-align:left !important; }
.q-res h1{ font-family:var(--q-font-h); font-size:1.7rem; font-weight:800; line-height:1.15; letter-spacing:-0.02em; margin:6px 0 10px; }
.q-res h1 em{ font-style:normal; color:var(--q-orange); }
.q-res__espejo{ font-size:1.04rem; line-height:1.5; color:#2a3f54; margin:0 0 18px !important; }
.q-card{ background:var(--q-card); border:1px solid var(--q-line); border-radius:16px; padding:16px 18px; margin:0 0 14px; }
.q-card h2{ font-family:var(--q-font-h); font-size:0.74rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--q-ink-mute); margin:0 0 10px; }
.q-chip{ display:inline-block; font-family:var(--q-font-h); font-size:0.66rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--q-orange-deep); background:var(--q-orange-soft); border-radius:50px; padding:5px 10px; margin-bottom:8px; }
.q-cerebro p{ font-size:0.98rem; line-height:1.5; margin:0 !important; text-align:left !important; }
.q-cerebro p + p{ margin-top:8px !important; }
.q-cerebro b{ color:var(--q-ink); }
.q-cerebro .q-cerebro__nota{ font-size:0.85rem; color:var(--q-ink-mute); }
.q-medidor{ margin:0 0 12px; }
.q-medidor__fila{ display:flex; justify-content:space-between; gap:10px; font-size:0.9rem; line-height:1.35; margin-bottom:6px; }
.q-medidor__fila b{ font-family:var(--q-font-h); white-space:nowrap; }
.q-medidor__barra{ height:10px; border-radius:5px; background:var(--q-line); overflow:hidden; }
.q-medidor__barra i{ display:block; height:100%; border-radius:5px; background:var(--q-orange); }
.q-vemos{ list-style:none; padding:0; margin:0; }
.q-vemos li{ position:relative; padding-left:20px; list-style:none; font-size:0.96rem; line-height:1.5; margin-bottom:8px; }
.q-vemos li:last-child{ margin-bottom:0; }
.q-vemos li::before{ content:''; position:absolute; left:2px; top:0.6em; width:8px; height:8px; border-radius:50%; background:var(--q-orange); }

/* escalones */
.q-esc{ display:flex; flex-direction:column-reverse; gap:8px; margin:4px 0 2px; }
.q-esc__paso{ display:flex; align-items:center; gap:12px; border-radius:12px; padding:12px 14px; background:var(--q-bg); border:1px dashed #C9D3DE; color:var(--q-ink-mute); }
.q-esc__paso:nth-child(1){ margin-right:28%; }
.q-esc__paso:nth-child(2){ margin-left:14%; margin-right:14%; }
.q-esc__paso:nth-child(3){ margin-left:28%; }
.q-esc__n{ flex:none; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--q-font-h); font-weight:800; font-size:0.85rem; background:#D7DEE7; color:#fff; }
.q-esc__t{ font-family:var(--q-font-h); font-size:0.9rem; font-weight:700; line-height:1.25; }
.q-esc__t small{ display:block; font-family:var(--q-font-b); font-weight:400; font-size:0.78rem; margin-top:2px; }
.q-esc__paso.is-hecho{ background:var(--q-navy); border:1px solid var(--q-navy); color:#fff; }
.q-esc__paso.is-hecho .q-esc__n{ background:var(--q-orange); }
.q-esc__paso.is-proximo{ background:#fff; border:1.5px solid var(--q-orange); color:var(--q-ink); }
.q-esc__paso.is-proximo .q-esc__n{ background:var(--q-orange); }
.q-esc__nota{ font-size:0.9rem; color:var(--q-ink-mute); line-height:1.45; margin-top:12px !important; }

/* invitación */
.q-inv{ background:var(--q-navy); color:#fff; border-radius:18px; padding:20px 18px; margin:18px 0 10px; }
.q-inv .q-chip{ background:rgba(255,102,2,0.18); color:#FF8A3D; }
.q-inv h2{ font-family:var(--q-font-h); font-size:1.25rem; font-weight:800; line-height:1.25; margin:0 0 8px; }
.q-inv p{ font-size:0.98rem; line-height:1.5; color:rgba(255,255,255,0.86); margin:0 0 16px !important; }
.q-inv__video{ border-radius:12px; overflow:hidden; background:#000; margin:0 0 16px; }
.q-inv__video[hidden]{ display:none !important; }
.q-inv__micro{ font-size:0.84rem !important; color:rgba(255,255,255,0.65) !important; text-align:center; margin:10px 0 0 !important; }
.q-otra{ text-align:center; margin-top:16px; }
</style>

    <div class="q-top__in">

var TEXTO_IDENTIFICO = { '2':'Te identificaste con esta frase:', '1':'Marcaste que a veces te pasa:' };

/* ─── utilidades ─── */
function qs(k){ var m=new RegExp('[?&]'+k+'=([^&#]*)').exec(window.location.search); return m?decodeURIComponent(m[1].replace(/\+/g,' ')).trim():''; }
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var FLECHA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
var ATRAS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
var contacto = { nombre:qs('nombre')||qs('name')||qs('first_name'), telefono:qs('telefono')||qs('phone'), email:qs('email'), cid:qs('cid')||qs('contact_id') };
var primerNombre = (contacto.nombre||'').split(' ')[0];
var main=document.getElementById('q-main'), pasoEl=document.getElementById('q-paso'), mapaEl=document.getElementById('q-mapa');
var resp={}, i=-1, GUARDADO='nfm_quiz_comunidad_v2';

/* ─── el mapa de arriba ─── */
mapaEl.innerHTML=PIEZAS.map(function(n){ return '<div class="q-mapa__pieza"><div class="q-mapa__barra"><i></i></div><span class="q-mapa__nom">'+esc(n)+'</span></div>'; }).join('');
function pintarMapa(){
  var piezas=mapaEl.querySelectorAll('.q-mapa__pieza');
  for(var p=0;p<PIEZAS.length;p++){
    var total=0, hechas=0;
    for(var k=0;k<PASOS.length;k++) if(PASOS[k].pieza===p){ total++; if(resp[PASOS[k].id]!==undefined) hechas++; }
    piezas[p].querySelector('i').style.width=Math.round(hechas/total*100)+'%';
    piezas[p].classList.toggle('is-lista', hechas===total);
  }
  var n=0; for(var q=0;q<=i && q<PASOS.length;q++) if(PASOS[q].tipo!=='dato') n++;
  pasoEl.textContent = (i>=0 && i<PASOS.length) ? (PASOS[i].tipo==='dato' ? 'Un dato para vos' : 'Pregunta '+n+' de '+PREGUNTAS) : '';
}

/* ─── pantallas ─── */
function intro(){
  i=-1; pintarMapa();
  main.innerHTML='<section class="q-pantalla q-intro">'
    +'<div class="q-escalon-mini" aria-hidden="true"><span></span><span></span><span></span></div>'
    +'<span class="q-seccion">Comunidad Productiva</span>'
    +'<h1>'+(primerNombre?esc(primerNombre)+', ya':'Ya')+' subiste <em>el primer escalón.</em></h1>'
    +'<p class="q-intro__txt">Ahora armemos tu mapa. Son 3 minutos para contarnos cómo es tu semana y ver tu próximo escalón.</p>'
    +'<button type="button" class="q-btn" data-accion="empezar">ARMAR MI MAPA '+FLECHA+'</button>'
    +'<p class="q-intro__micro">Son preguntas de un toque. No hay respuestas correctas.</p></section>';
}
function pantalla(){
  var P=PASOS[i]; pintarMapa();
  var h='<section class="q-pantalla" data-paso="'+P.id+'">';
  h+='<button type="button" class="q-atras" data-accion="atras">'+ATRAS+'Volver</button><br>';
  if(P.tipo==='dato'){
    h+='<div class="q-dato"><span class="q-chip">Un dato para vos</span><h2>'+esc(P.titulo)+'</h2><p>'+esc(P.texto)+'</p></div>';
    h+='<button type="button" class="q-btn" data-accion="seguir">SEGUIR '+FLECHA+'</button>';
    main.innerHTML=h+'</section>'; window.scrollTo(0,0); return;
  }
  h+='<span class="q-seccion">'+esc(P.seccion)+'</span>';
  var actual=resp[P.id];
  if(P.tipo==='frase'){
    h+='<p class="q-frase">'+esc(P.frase)+'</p><p class="q-pregunta q-pregunta--chica" id="q-preg">¿Te identificás con esto?</p><div class="q-ident" role="radiogroup" aria-labelledby="q-preg">';
    IDENTIFICO.forEach(function(o){ h+=opcion(o, actual===o.v, false, true); });
    h+='</div>';
  } else if(P.tipo==='escala'){
    h+='<p class="q-pregunta" id="q-preg">'+esc(P.pregunta)+'</p><div class="q-escala" role="radiogroup" aria-labelledby="q-preg">';
    for(var e=1;e<=10;e++) h+=opcion({v:String(e), t:String(e)}, actual===String(e), false, true);
    h+='</div><div class="q-escala__ext" aria-hidden="true"><span>'+esc(P.min)+'</span><span>'+esc(P.max)+'</span></div>';
  } else if(P.tipo==='uno' || P.tipo==='varios'){
    h+='<p class="q-pregunta" id="q-preg">'+esc(P.pregunta)+'</p>';
    if(P.ayuda) h+='<p class="q-ayuda">'+esc(P.ayuda)+'</p>';
    h+='<div role="'+(P.tipo==='uno'?'radiogroup':'group')+'" aria-labelledby="q-preg">';
    for(var k=0;k<P.opciones.length;k++){ var o=P.opciones[k]; h+=opcion(o, P.tipo==='uno' ? actual===o.v : (actual||[]).indexOf(o.v)>-1, P.tipo==='varios', false); }
    h+='</div>';
    if(P.tipo==='varios') h+='<button type="button" class="q-btn" data-accion="listo"'+((actual&&actual.length)?'':' disabled')+'>LISTO '+FLECHA+'</button>';
  } else {
    h+='<p class="q-pregunta" id="q-preg">'+esc(P.pregunta)+'</p>';
    h+='<input class="q-input" id="q-texto" type="text" maxlength="140" autocomplete="off" aria-labelledby="q-preg" placeholder="'+esc(P.placeholder||'')+'" value="'+esc(resp[P.id]||'')+'">';
    h+='<button type="button" class="q-btn" data-accion="texto">SIGUIENTE '+FLECHA+'</button>';
    h+='<button type="button" class="q-link" data-accion="saltar">Prefiero saltear esta</button>';
  }
  main.innerHTML=h+'</section>';
  window.scrollTo(0,0);
}
function opcion(o, sel, multi, sinMarca){
  return '<button type="button" class="q-opc'+(multi?' q-opc--multi':'')+(sel?' is-sel':'')+'" data-v="'+esc(o.v)+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="'+(sel?'true':'false')+'"><span class="q-opc__t">'+esc(o.t)+'</span>'+(sinMarca?'':'<span class="q-opc__marca"></span>')+'</button>';
}
function siguiente(){ if(i<PASOS.length-1){ i++; pantalla(); } else armando(); }

/* ─── resultado ─── */
function calcular(){
  var s=[0,1,2,3,4].map(function(n){ return +(resp['s'+(n+1)]||0); });
  var carga=s[0]+s[1]+s[2]+s[3]+s[4];   // 0 a 10
  /* PERFIL: la frase que más marcó. Si empatan, gana la primera de esta lista (la de los pendientes va última por ser la más general). */
  var puntos={ sosten:s[1], incendios:s[2], arranque:s[3], mente:s[4], pendientes:s[0] }, perfil='equilibrio', max=0;
  ['sosten','incendios','arranque','mente','pendientes'].forEach(function(k){ if(puntos[k]>max){ max=puntos[k]; perfil=k; } });
  /* CALIFICA: momento A o B (no está en etapa de arranque económico) y quiere el cambio en los próximos 3 meses.
     Nivel: alto = A/B con gente a cargo · medio = A/B sin gente a cargo · bajo = C. */
  var califica = resp.momento!=='C' && resp.urgencia!=='sin_apuro';
  var nivel = resp.momento==='C' ? 'bajo' : ((resp.equipo==='A'||resp.equipo==='B') ? 'alto' : 'medio');
  return { carga:carga, cargaNivel: carga>=7?'alta':(carga>=4?'media':'baja'), perfil:perfil, califica:califica, nivel:nivel, destino: califica?'agenda':'libro' };
}
function armando(){
  i=PASOS.length; pintarMapa(); pasoEl.textContent='Mapa completo';
  var R=calcular(); enviar(R,'quiz_completo'); guardar(R);
  main.innerHTML='<section class="q-pantalla q-armando"><h2>Armando tu mapa…</h2><ul>'
    +'<li><b>✓</b>Tu momento</li><li><b>✓</b>Tu semana</li><li><b>✓</b>Tu próximo escalón</li></ul></section>';
  var lis=main.querySelectorAll('li'), n=0, rapido=window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var t=setInterval(function(){ if(n<lis.length){ lis[n].classList.add('is-ok'); n++; } else { clearInterval(t); resultado(R); } }, rapido?120:520);
}
function resultado(R){
  var P=PERFILES[R.perfil];
  var vemos=[];
  if(+resp.cerca && +resp.cerca<10) vemos.push('Marcaste un '+resp.cerca+': hay '+(10-resp.cerca)+(10-resp.cerca===1?' punto':' puntos')+' entre tu semana de hoy y la que querés.');
  var probado=(resp.probado||[]).filter(function(v){ return v!=='nada'; });
  if(probado.length) vemos.push('Lo que ya probaste: '+probado.map(function(v){ return TEXTO_PROBADO[v]; }).join(', ')+'.');
  else if((resp.probado||[]).length) vemos.push('Todavía no probaste ningún sistema para organizarte.');
  if(resp.seguimiento==='dejo') vemos.push('La última vez, sin nadie que te preguntara cómo ibas, lo dejaste a las pocas semanas.');
  else if(resp.seguimiento==='cayo') vemos.push('La última vez, sin nadie que te preguntara cómo ibas, lo sostuviste un tiempo y después se cayó.');
  else if(resp.seguimiento==='sostuvo') vemos.push('La última vez lo sostuviste sin que nadie te preguntara cómo ibas.');
  if(resp.objetivo) vemos.push('Tu meta a 90 días: '+TEXTO_OBJETIVO[resp.objetivo]+'.');
  if(resp.pendiente) vemos.push('Lo que siempre te queda para después: “'+resp.pendiente+'”.');

  var h='<section class="q-pantalla q-res">';
  h+='<span class="q-res__kicker">Tu mapa'+(primerNombre?' · '+esc(primerNombre):'')+'</span>';
  if(P.frase){
    h+='<h1>Lo que más marcaste: <em>'+esc(P.nombre)+'</em></h1>';
    h+='<p class="q-res__espejo">'+esc(TEXTO_IDENTIFICO[resp[P.frase]])+' <b>“'+esc(PASOS.filter(function(x){ return x.id===P.frase; })[0].frase)+'”</b></p>';
  } else {
    h+='<h1>Hoy <em>ninguna</em> de las situaciones te pasa.</h1>';
    h+='<p class="q-res__espejo">Marcaste “No me pasa” en las cinco.</p>';
  }
  h+='<div class="q-card q-cerebro"><span class="q-chip">'+esc(P.concepto)+'</span><p><b>Lo que muestran los estudios:</b> '+esc(P.estudio)+'</p><p class="q-cerebro__nota">Son datos generales. En cada persona se da distinto.</p></div>';
  h+='<div class="q-card"><h2>Lo que nos contaste</h2>'
    +medidor('Cuánto te pesa la semana', resp.peso)+medidor('Qué tan cerca estás de la semana que querés', resp.cerca)
    +'<ul class="q-vemos">'+vemos.map(function(v){ return '<li>'+esc(v)+'</li>'; }).join('')+'</ul></div>';
  h+='<div class="q-card"><h2>Tus escalones en el Instituto</h2><div class="q-esc">'
    +'<div class="q-esc__paso is-hecho"><span class="q-esc__n">✓</span><span class="q-esc__t">Comunidad Productiva<small>Las bases. Ya estás acá.</small></span></div>'
    +'<div class="q-esc__paso'+(R.califica?' is-proximo':'')+'"><span class="q-esc__n">2</span><span class="q-esc__t">Clases con expertos<small>Con seguimiento 1 a 1.</small></span></div>'
    +'<div class="q-esc__paso'+(R.califica?' is-proximo':'')+'"><span class="q-esc__n">3</span><span class="q-esc__t">Proceso personalizado<small>Con un experto asignado, 1 a 1.</small></span></div>'
    +'</div><p class="q-esc__nota">Con la Comunidad ya sos parte del Instituto de Productividad.</p></div>';
  if(R.califica){
    h+='<div class="q-inv"><span class="q-chip">Invitación especial</span><h2>Cada caso es distinto. El tuyo lo vemos juntos.</h2>'
      +'<p>Te invitamos a una sesión con un asesor del Instituto de Productividad. Revisan tu mapa juntos y ven por dónde conviene arrancar en tu caso. Lo único que tenés que hacer es aceptar.</p>'
      +'<div class="q-inv__video" id="q-video"></div>'
      +'<button type="button" class="q-btn" id="q-cta" data-accion="agenda">ACEPTO LA INVITACIÓN '+FLECHA+'</button>'
      +'<p class="q-inv__micro">Elegís el día y el horario acá mismo.</p></div>'
      +'<div class="q-agenda" id="q-agenda" hidden></div>'
      +'<p class="q-agenda-alt" id="q-agenda-alt" hidden><a class="q-link" href="'+esc(linkAgenda(R))+'" target="_blank" rel="noopener">¿No ves la agenda? Abrila acá</a></p>'
      +'<div class="q-agendado" id="q-agendado" role="status" hidden>✓ ¡Listo! Ya tenés tu sesión. Te llega la confirmación por mail.</div>';
  } else {
    h+='<div class="q-inv"><span class="q-chip">Tu próximo paso</span><h2>Para sacarle más jugo a tus bases.</h2>'
      +'<p>Te recomendamos <b>Hackea tu cerebro</b>, el libro de Nico: la neurociencia detrás de cómo te organizás, explicada para usarla en tu semana.</p>'
      +'<a class="q-btn" id="q-cta" href="'+esc(CONFIG.LIBRO_URL||'#')+'" target="_blank" rel="noopener" data-evento="clic_libro">QUIERO EL LIBRO '+FLECHA+'</a></div>';
  }
  h+='<div class="q-otra"><button type="button" class="q-link" data-accion="reiniciar">Volver a hacer el quiz</button></div>';
  main.innerHTML=h+'</section>';
  if(R.califica) ponerVideo();
  window.scrollTo(0,0);
}
function medidor(lbl, v){ v=+v||0; if(!v) return ''; return '<div class="q-medidor"><div class="q-medidor__fila"><span>'+esc(lbl)+'</span><b>'+v+' de 10</b></div><div class="q-medidor__barra"><i style="width:'+(v*10)+'%"></i></div></div>'; }
/* ─── agenda de Calendly adentro del quiz ───
   Se carga recién cuando aceptan la invitación. Llega con nombre y mail precargados.
   Si agendan, Calendly avisa con un mensaje y lo mandamos a n8n como evento "agendo". */
function abrirAgenda(R){
  var box=document.getElementById('q-agenda'), alt=document.getElementById('q-agenda-alt'); if(!box) return;
  enviar(R,'clic_agenda');
  box.hidden=false; if(alt) alt.hidden=false;
  if(!box.getAttribute('data-listo')){
    box.setAttribute('data-listo','1');
    var url=CONFIG.AGENDA_URL+(CONFIG.AGENDA_URL.indexOf('?')===-1?'?':'&')+'hide_gdpr_banner=1';
    var iniciar=function(){ try{ window.Calendly.initInlineWidget({ url:url, parentElement:box, prefill:{ name:contacto.nombre||'', email:contacto.email||'' }, utm:{ utmSource:CONFIG.ORIGEN, utmContent:R.perfil } }); }catch(e){} };
    if(window.Calendly && window.Calendly.initInlineWidget) iniciar();
    else { var sc=document.createElement('script'); sc.src='https://assets.calendly.com/assets/external/widget.js'; sc.async=true; sc.onload=iniciar; document.head.appendChild(sc); }
  }
  setTimeout(function(){ box.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60);
}
window.addEventListener('message', function(e){
  if(!e.data || typeof e.data!=='object' || String(e.origin).indexOf('calendly.com')===-1) return;
  if(e.data.event==='calendly.event_scheduled'){
    var g=leerGuardado(); if(g) enviar(g.R,'agendo');
    var ok=document.getElementById('q-agendado'); if(ok) ok.hidden=false;
  }
});
function linkAgenda(R){
  var u=CONFIG.AGENDA_URL; if(!u) return '#';
  var p=['utm_source='+encodeURIComponent(CONFIG.ORIGEN),'utm_content='+encodeURIComponent(R.perfil)];
  if(contacto.nombre) p.push('name='+encodeURIComponent(contacto.nombre));
  if(contacto.email) p.push('email='+encodeURIComponent(contacto.email));
  return u+(u.indexOf('?')===-1?'?':'&')+p.join('&');
}
function ponerVideo(){
  var box=document.getElementById('q-video'), tpl=document.getElementById('q-video-invitacion'); if(!box) return;
  if(!tpl || !tpl.innerHTML.trim()){ box.hidden=true; return; }
  box.appendChild(tpl.content.cloneNode(true));
  /* los <script> que vienen en el código del video (vTurb, etc.) hay que volver a crearlos para que corran */
  var viejos=box.querySelectorAll('script');
  for(var k=0;k<viejos.length;k++){ var n=document.createElement('script'); if(viejos[k].src) n.src=viejos[k].src; else n.text=viejos[k].text; n.async=true; viejos[k].parentNode.replaceChild(n, viejos[k]); }
}

/* ─── envío a n8n ───
   Formulario simple (sin preflight de CORS): n8n lo recibe como campos en el body. */
function datos(R, evento){
  var d={ evento:evento, origen:CONFIG.ORIGEN, fecha:new Date().toISOString(),
    nombre:contacto.nombre, telefono:contacto.telefono, email:contacto.email, cid:contacto.cid,
    momento:resp.momento||'', equipo:resp.equipo||'', dedicacion:resp.dedicacion||'',
    s1_pendientes:resp.s1||'', s2_cosas_para_despues:resp.s2||'', s3_interrupciones:resp.s3||'', s4_se_apaga:resp.s4||'', s5_mente_encendida:resp.s5||'',
    peso:resp.peso||'', cerca:resp.cerca||'',
    probado:(resp.probado||[]).join(','), seguimiento:resp.seguimiento||'', objetivo:resp.objetivo||'', pendiente:resp.pendiente||'', urgencia:resp.urgencia||'',
    perfil:R.perfil, carga:R.carga, califica:R.califica?'si':'no', nivel:R.nivel, destino:R.destino,
    utm_source:qs('utm_source'), utm_campaign:qs('utm_campaign') };
  return d;
}
function enviar(R, evento){
  if(!CONFIG.WEBHOOK_URL) return;
  var body=new URLSearchParams(datos(R, evento));
  try{
    if(navigator.sendBeacon && navigator.sendBeacon(CONFIG.WEBHOOK_URL, body)) return;
  }catch(e){}
  try{ fetch(CONFIG.WEBHOOK_URL, { method:'POST', mode:'no-cors', keepalive:true, body:body }); }catch(e){}
}
function guardar(R){ try{ localStorage.setItem(GUARDADO, JSON.stringify({ resp:resp, R:R })); }catch(e){} }

/* ─── clics ─── */
main.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('button, a') : null; if(!t) return;
  var accion=t.getAttribute('data-accion'), P=PASOS[i];
  if(accion==='empezar'){ i=0; pantalla(); return; }
  if(accion==='atras'){ if(i>0){ i--; pantalla(); } else intro(); return; }
  if(accion==='reiniciar'){ resp={}; try{ localStorage.removeItem(GUARDADO); }catch(err){} intro(); return; }
  if(accion==='seguir'){ siguiente(); return; }
  if(accion==='agenda'){ var ga=leerGuardado(); abrirAgenda(ga?ga.R:calcular()); return; }
  if(t.getAttribute('data-evento')){ var g=leerGuardado(); if(g) enviar(g.R, t.getAttribute('data-evento')); return; }
  if(t.classList.contains('q-opc') && P){
    var v=t.getAttribute('data-v');
    if(P.tipo!=='varios'){
      resp[P.id]=v;
      var todos=main.querySelectorAll('.q-opc'); for(var k=0;k<todos.length;k++){ var on=todos[k]===t; todos[k].classList.toggle('is-sel',on); todos[k].setAttribute('aria-checked',on?'true':'false'); }
      pintarMapa(); setTimeout(siguiente, 230); return;
    }
    var lista=(resp[P.id]||[]).slice(), solo=P.opciones.filter(function(o){ return o.solo; }).map(function(o){ return o.v; });
    var pos=lista.indexOf(v);
    if(pos>-1) lista.splice(pos,1); else { if(solo.indexOf(v)>-1) lista=[v]; else { lista=lista.filter(function(x){ return solo.indexOf(x)===-1; }); lista.push(v); } }
    resp[P.id]=lista.length?lista:undefined; if(!lista.length) delete resp[P.id];
    var bs=main.querySelectorAll('.q-opc'); for(var b=0;b<bs.length;b++){ var on2=lista.indexOf(bs[b].getAttribute('data-v'))>-1; bs[b].classList.toggle('is-sel',on2); bs[b].setAttribute('aria-checked',on2?'true':'false'); }
    var listo=main.querySelector('[data-accion="listo"]'); if(listo) listo.disabled=!lista.length;
    pintarMapa(); return;
  }
  if(accion==='listo'){ if(resp[P.id]&&resp[P.id].length) siguiente(); return; }
  if(accion==='texto'){ var inp=document.getElementById('q-texto'); resp[P.id]=(inp&&inp.value.trim())||''; siguiente(); return; }
  if(accion==='saltar'){ resp[P.id]=''; siguiente(); return; }
});
main.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='q-texto'){ e.preventDefault(); var b=main.querySelector('[data-accion="texto"]'); if(b) b.click(); } });
function leerGuardado(){ try{ return JSON.parse(localStorage.getItem(GUARDADO)||'null'); }catch(e){ return null; } }

/* si ya lo hizo, vuelve a ver su resultado */
var g=leerGuardado();
if(g && g.R && g.resp){ resp=g.resp; i=PASOS.length; pintarMapa(); pasoEl.textContent='Mapa completo'; resultado(g.R); } else intro();
})();
</script>
