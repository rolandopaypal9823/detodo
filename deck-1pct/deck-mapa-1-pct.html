<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El mapa del 1% · Instituto NFM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0c3452;
  --blue-dark:#061d30;
  --blue-light:#e7edf2;
  --orange:#ff6602;
  --white:#ffffff;
  --locked:#c9d2da;
  --green:#25d366;
  --mono:'JetBrains Mono',monospace;
  --sans:'Open Sans',sans-serif;
  --disp:'Montserrat',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08151f}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.hide-cursor,body.hide-cursor *{cursor:none}

#stage{position:fixed;inset:0;display:grid;place-items:center}
#canvas{
  position:relative;width:1920px;height:1080px;background:var(--white);
  transform-origin:center center;overflow:hidden;
}

/* ---------- slides ---------- */
.slide{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .32s ease;
}
.slide.on{opacity:1;pointer-events:auto}
.slide > div{height:100%}
.slide.dark{background:var(--blue-dark);color:var(--white)}

/* ---------- capa del mapa (UN solo componente) ---------- */
#mapLayer{
  position:absolute;top:22px;left:60px;width:1800px;height:450px;
  opacity:0;pointer-events:none;z-index:5;
  transition:opacity .32s ease, transform .55s cubic-bezier(.65,.02,.25,1);
  transform:translateY(0) scale(1);
  transform-origin:center center;
}
#mapLayer.on{opacity:1}
#mapLayer.hero{transform:translateY(224px) scale(1.04)}
#mapCam{position:absolute;inset:0;width:1800px;height:450px;transform-origin:0 0;
  transition:transform .62s cubic-bezier(.55,.06,.28,1)}
#mapSvg{position:absolute;inset:0;width:1800px;height:450px;overflow:visible}

/* estados de estación */
.st{transition:opacity .5s ease}
.st.hidden{opacity:0}
.origin circle{fill:var(--blue)}
.origin text{font-family:var(--mono);font-size:17px;letter-spacing:.18em;text-transform:uppercase;fill:var(--blue);text-anchor:middle;opacity:.6}
.st .disc{fill:var(--white);stroke:var(--locked);stroke-width:4;transition:stroke .45s ease}
.st .ico{color:var(--locked);transition:color .45s ease}
.st .num{font-family:var(--disp);font-weight:900;font-size:42px;fill:var(--locked);text-anchor:middle;transition:fill .45s ease}
.st .lab{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.05em;fill:var(--locked);text-anchor:middle;text-transform:uppercase;transition:fill .45s ease}
.st .halo{fill:none;stroke:var(--orange);stroke-width:4.5;opacity:0;transform:scale(.72);transform-origin:center;transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.4,.64,1)}
.st .chk{opacity:0;transition:opacity .35s ease .12s}
.st .chk circle{fill:var(--green)}
.st .chk path{stroke:var(--white);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

.st.done .disc{stroke:var(--blue)}
.st.done .ico{color:var(--blue)}
.st.done .num{fill:var(--blue)}
.st.done .lab{fill:var(--blue)}
.st.done .chk{opacity:1}

.st.current .disc{stroke:var(--blue);stroke-width:4.5}
.st.current .ico{color:var(--blue)}
.st.current .num{fill:var(--orange)}
.st.current .lab{fill:var(--blue)}
.st.current .halo{opacity:1;transform:scale(1)}

/* trazado */
#pathBase{fill:none;stroke:var(--locked);stroke-width:6;stroke-linecap:round;stroke-dasharray:2 18}
#pathDone{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .62s cubic-bezier(.65,.02,.25,1)}

/* marcador Mini Nico */
#marker{
  position:absolute;left:0;top:0;width:112px;height:138px;
  transition:transform .55s cubic-bezier(.55,.06,.28,1);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  pointer-events:none;
}
#marker img{max-width:112px;max-height:126px;object-fit:contain;display:none}
#marker.has-img .mn-fallback{display:none}
#marker.has-img img{display:block}
.mn-fallback{display:flex;flex-direction:column;align-items:center}
.mn-pin{
  width:86px;height:86px;border-radius:50%;background:var(--orange);
  display:grid;place-items:center;color:var(--white);
  font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:.02em;
  box-shadow:0 14px 30px rgba(255,102,2,.32);
}
.mn-tip{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:16px solid var(--orange);margin-top:-2px}

/* ---------- portada ---------- */
.cover{padding:150px 130px;display:flex;flex-direction:column;justify-content:center}
.brandbar{display:flex;align-items:center;gap:18px;margin-bottom:64px}
.brandbar .rule{width:96px;height:5px;background:var(--orange)}
.kicker{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue)}
.cover h1{font-family:var(--disp);font-weight:900;font-size:132px;line-height:.98;color:var(--blue);letter-spacing:-.025em;text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--orange)}
.cover .sub{font-size:40px;color:var(--blue);opacity:.72;margin-top:44px;font-weight:600}
.cover .hint{position:absolute;left:130px;bottom:96px;font-family:var(--mono);font-size:20px;letter-spacing:.16em;color:var(--blue);opacity:.42;text-transform:uppercase}

/* ---------- slide hero del mapa (intro / cierre) ---------- */
.hero-slide{padding:112px 130px;display:flex;flex-direction:column;justify-content:space-between}
.hero-slide h2{font-family:var(--disp);font-weight:900;font-size:76px;line-height:1.02;color:var(--blue);letter-spacing:-.02em;max-width:1300px;text-wrap:balance}
.hero-slide h2 em{font-style:normal;color:var(--orange)}
.hero-foot{font-size:34px;color:var(--blue);opacity:.7;font-weight:600;max-width:1150px}

/* ---------- slides de nodo ---------- */
.node-slide{padding:502px 90px 52px;display:grid;grid-template-columns:1fr 880px;gap:76px;align-items:center}
.step-label{font-family:var(--mono);font-size:23px;letter-spacing:.26em;text-transform:uppercase;color:var(--orange);margin-bottom:28px}
.step-label span{color:var(--blue);opacity:.45}
.dots{display:inline-flex;gap:8px;margin-left:20px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--blue-light);display:block}
.dots i.on{background:var(--orange)}
.node-slide h2{font-family:var(--disp);font-weight:800;font-size:62px;line-height:1.06;color:var(--blue);letter-spacing:-.02em;text-wrap:balance}
.node-copy{font-size:33px;line-height:1.45;color:var(--blue);opacity:.82;margin-top:30px;max-width:840px;text-wrap:pretty}
.node-note{margin-top:40px;padding-top:28px;border-top:2px solid var(--blue-light);font-family:var(--mono);font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);opacity:.5}

/* marco de asset */
.frames{display:flex;gap:26px;height:502px}
.frame{flex:1;border:2px dashed var(--locked);border-radius:12px;display:grid;place-items:center;background:#fbfcfd;overflow:hidden;position:relative}
.frame.drop{border:3px solid var(--orange)!important;background:#fff7f2}
.frame.real{border:2px solid var(--blue-light);background:var(--white);box-shadow:0 30px 70px rgba(12,52,82,.10)}
.frame img{width:100%;height:100%;object-fit:contain;display:none}
.frame.loaded img{display:block}
.frame.loaded .ph{display:none}
.ph{text-align:center;padding:24px}
.ph .ph-t{font-family:var(--mono);font-size:19px;letter-spacing:.1em;color:var(--blue);opacity:.55;word-break:break-word}
.ph .ph-s{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--locked);margin-bottom:14px}

/* ---------- mock de WhatsApp (render nativo, sin screenshot) ---------- */
.wa{width:100%;height:100%;background:var(--blue-light);display:flex;flex-direction:column;border-radius:10px;overflow:hidden}
.wa-top{background:var(--blue);color:var(--white);display:flex;align-items:center;gap:14px;padding:16px 18px;flex:none}
.wa-av{width:46px;height:46px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:16px;color:var(--white);flex:none}
.wa-who{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.2}
.wa-st{font-size:14px;opacity:.65;font-weight:400}
.wa-body{flex:1;min-height:0;padding:18px 16px;display:flex;flex-direction:column;gap:11px;justify-content:flex-end;overflow:hidden}
.wa-b{max-width:90%;background:var(--white);border-radius:4px 12px 12px 12px;padding:12px 15px 8px;font-size:18px;line-height:1.38;color:#111b21;box-shadow:0 1px 2px rgba(6,29,48,.14)}
.wa-b strong{font-weight:700}
.wa-time{display:block;text-align:right;font-size:13px;color:#667781;margin-top:5px}
.wa-link{padding:0;overflow:hidden}
.wa-prev{background:#f2f6f8;border-bottom:1px solid #e2e9ee;padding:12px 14px}
.wa-prev-t{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--blue)}
.wa-prev-d{font-size:14px;color:#667781;margin-top:3px}
.wa-url{padding:10px 15px 8px;font-size:17px;color:#0a7cba;word-break:break-all;line-height:1.35}
.wa-in{flex:none;background:var(--white);margin:0 12px 12px;border-radius:100px;padding:11px 20px;font-size:16px;color:#8696a0}

/* ---------- puertas (nodo 8) ---------- */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:26px;height:502px}
.par{border:3px solid var(--blue-light);border-radius:12px;padding:38px 34px;display:flex;flex-direction:column;justify-content:center}
.par .d-lab{font-family:var(--mono);font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.par h3{font-family:var(--disp);font-weight:800;font-size:36px;line-height:1.12;color:var(--blue);margin-top:16px}
.par p{font-size:24px;line-height:1.45;color:var(--blue);opacity:.72;margin-top:16px;text-wrap:pretty}
.lista{height:502px;border:3px solid var(--blue);border-radius:12px;padding:44px 46px;display:flex;flex-direction:column;justify-content:center}
.lista .d-lab{font-family:var(--mono);font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.lista h3{font-family:var(--disp);font-weight:900;font-size:46px;line-height:1.1;color:var(--blue);margin:16px 0 30px;letter-spacing:-.02em}
.lista ul{list-style:none;display:flex;flex-direction:column;gap:19px}
.lista li{display:flex;gap:18px;align-items:baseline;font-size:28px;line-height:1.35;color:var(--blue)}
.lista li span{color:var(--green);font-weight:700;flex:none}
.doors{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;height:502px}
.door{border:3px solid var(--locked);border-radius:12px;padding:34px 30px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .4s ease,background .4s ease,transform .4s ease}
.door .d-lab{font-family:var(--mono);font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--locked);transition:color .4s ease}
.door h3{font-family:var(--disp);font-weight:800;font-size:38px;line-height:1.1;color:var(--locked);margin-top:14px;transition:color .4s ease}
.door p{font-size:23px;line-height:1.4;color:var(--locked);margin-top:14px;transition:color .4s ease}
.door svg{color:var(--locked);transition:color .4s ease}
.door.lit{border-color:var(--blue)}
.door.lit .d-lab{color:var(--orange)}
.door.lit h3,.door.lit p{color:var(--blue)}
.door.lit svg{color:var(--blue)}
.door.lit.small{border-color:var(--orange)}

/* ---------- calificador ---------- */
.qual{padding:104px 110px 90px;display:flex;flex-direction:column}
.qual .kicker{color:var(--white);opacity:.55}
.qual .brandbar{margin-bottom:52px}
.qual h2{font-family:var(--disp);font-weight:900;font-size:66px;color:var(--white);letter-spacing:-.02em;margin-bottom:56px}
.qcols{display:grid;grid-template-columns:1fr 1fr;gap:96px;flex:1;align-items:center}
.qcol h3{font-family:var(--disp);font-weight:800;font-size:40px;margin-bottom:34px;line-height:1.15}
.qcol.yes h3{color:var(--white)}
.qcol.no h3{color:var(--orange)}
.qcol.yes p{font-size:28px;line-height:1.5;color:var(--white);opacity:.88;text-wrap:pretty}
.qcol.yes p+p{margin-top:22px}
.qcol.yes strong{color:var(--orange);font-weight:700}
.qlist{list-style:none;display:flex;flex-direction:column;gap:26px}
.qlist li{display:flex;gap:20px;font-size:25px;line-height:1.42;color:var(--white);opacity:.92;text-wrap:pretty}
.qlist .x{color:var(--orange);font-family:var(--disp);font-weight:900;font-size:27px;flex:none;line-height:1.42}
.qlist strong{color:var(--orange);font-weight:700}
.qdiv{width:2px;background:rgba(255,255,255,.14);position:absolute;left:50%;top:280px;bottom:110px}

/* ---------- CTA ---------- */
.cta{padding:100px 110px;display:grid;grid-template-columns:1fr 600px;gap:80px;align-items:center}
.cta-note{margin-top:44px;padding-top:26px;border-top:2px solid var(--blue-light);font-size:25px;line-height:1.45;color:var(--blue);opacity:.8;max-width:700px}
.cta-note b{opacity:1;font-weight:700}
.qrcol{display:flex;flex-direction:column;align-items:center;gap:28px}
.cupos{font-family:var(--disp);font-weight:900;font-size:40px;color:var(--orange);letter-spacing:-.01em}
.cta h2{font-family:var(--disp);font-weight:900;font-size:82px;line-height:1.03;color:var(--blue);letter-spacing:-.025em;text-wrap:balance}
.cta h2 em{font-style:normal;color:var(--orange)}
.cta p{font-size:34px;line-height:1.45;color:var(--blue);opacity:.8;margin-top:38px;max-width:760px;text-wrap:pretty}
.cta .steps{display:flex;gap:14px;margin-top:52px;flex-wrap:wrap}
.cta .steps span{font-family:var(--mono);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);border:2px solid var(--blue-light);border-radius:100px;padding:12px 22px}
.qrbox{width:600px;height:600px;border:3px solid var(--orange);border-radius:14px;display:grid;place-items:center;background:var(--white);box-shadow:0 40px 90px rgba(255,102,2,.16)}
.qrbox .frame{border:none;background:transparent;width:100%;height:100%}


/* ---------- mockups de pantallas reales (se reemplazan solos si aparece el PNG) ---------- */
.frame.loaded .mk{display:none}
.mk{--ink:#0c3452;--mut:#6b7c8a;--line:#dde5ea;--soft:#f2f6f8;
  position:absolute;inset:0;background:var(--white);display:flex;flex-direction:column;
  font-family:var(--sans);color:var(--ink);text-align:left;overflow:hidden}
.mk-bar{flex:none;height:36px;background:#eef2f5;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 13px}
.mk-dot{width:9px;height:9px;border-radius:50%;background:#c6d0d8;flex:none}
.mk-url{margin-left:10px;background:var(--white);border-radius:100px;font-family:var(--mono);font-size:11px;color:#93a1ac;padding:5px 14px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mk-body{flex:1;min-height:0;position:relative;overflow:hidden}
.mk-pad{padding:20px 22px;display:flex;flex-direction:column;gap:13px;height:100%}
.mk-cut{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--white))}

.mk h4{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:-.01em}
.mk .lbl{font-size:11.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
.mk .inp{border:1.5px solid #cfdae2;border-radius:5px;height:30px;background:var(--white)}
.mk .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mk .q{font-size:12.5px;font-weight:700;line-height:1.35;margin-top:2px}
.mk .opts{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.mk .opt{display:flex;gap:9px;font-size:11.5px;line-height:1.35;color:#33475a}
.mk .rd{width:13px;height:13px;border:1.5px solid #b7c4ce;border-radius:50%;flex:none;margin-top:1px}
.mk .rd.on{border-color:var(--orange);border-width:4px}
.mk .btn{align-self:flex-start;background:#0b6bcb;color:var(--white);font-size:12.5px;font-weight:600;padding:9px 26px;border-radius:100px;margin-top:auto}

/* calendario */
.mk-cal{display:grid;grid-template-columns:1fr 118px;gap:16px;height:100%}
.mk-cal .who{font-size:11px;color:var(--mut);font-weight:600}
.mk-cal .tit{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.2;margin:3px 0 6px}
.mk-cal .dur{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.08em}
.mk-cal .mth{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin:14px 0 8px}
.mk-cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.mk-cal .grid span{font-size:10.5px;color:#8fa0ad;padding:4px 0}
.mk-cal .grid b{font-size:11px;font-weight:500;color:#33475a;padding:5px 0;border-radius:50%}
.mk-cal .grid b.av{background:#e8f1fb;color:#0b6bcb;font-weight:700}
.mk-cal .grid b.sel{background:#0b6bcb;color:var(--white);font-weight:700}
.mk-cal .times{display:flex;flex-direction:column;gap:8px}
.mk-cal .times .t{border:1.5px solid #0b6bcb;color:#0b6bcb;border-radius:5px;text-align:center;font-size:11.5px;font-weight:600;padding:8px 0}
.mk-cal .times .h{font-size:10.5px;color:var(--mut);font-family:var(--mono);letter-spacing:.06em}

/* pagina de gracias */
.mk-th{align-items:center;text-align:center;justify-content:center;gap:0;padding:26px 40px}
.mk-th .tick{width:56px;height:56px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin-bottom:16px}
.mk-th .tick svg{stroke:var(--white);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mk-th .k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.mk-th h3{font-family:var(--disp);font-weight:900;font-size:31px;line-height:1.12;letter-spacing:-.02em}
.mk-th h3 em{font-style:normal;color:var(--orange)}
.mk-th .sub{font-size:15px;line-height:1.45;color:var(--mut);margin-top:12px;max-width:560px}
.mk-th .card{margin-top:20px;width:100%;max-width:600px;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:10px;padding:16px 20px}
.mk-th .wapp{display:flex;gap:12px;align-items:flex-start;background:#effaf3;border:1px solid #cdeeda;border-radius:8px;padding:12px 14px;text-align:left}
.mk-th .wapp .ic{width:26px;height:26px;border-radius:50%;background:var(--green);flex:none}
.mk-th .wapp b{font-size:13px;display:block;margin-bottom:2px}
.mk-th .wapp span{font-size:12.5px;color:var(--mut);line-height:1.4}
.mk-th .meta{display:flex;gap:26px;justify-content:center;margin-top:14px;font-size:12px;color:var(--mut)}
.mk-th .meta b{color:var(--ink)}

/* autodiagnostico */
.mk-dg{padding:22px 24px;gap:12px;background:#f4f7f9}
.mk-dg .badge{align-self:flex-start;border:1px solid #ffd3b4;background:#fff5ee;color:var(--orange);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:6px}
.mk-dg h3{font-family:var(--disp);font-weight:900;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.mk-dg p{font-size:12.5px;line-height:1.5;color:var(--mut)}
.mk-dg .c{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.mk-dg .c b{font-size:12.5px;display:block;margin-bottom:4px}
.mk-dg .c span{font-size:11.5px;line-height:1.45;color:var(--mut)}
.mk-dg .cta{margin-top:auto;background:var(--orange);color:var(--white);text-align:center;font-family:var(--disp);font-weight:800;font-size:15px;padding:14px;border-radius:8px}
.mk-dg .fin{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#9aa8b3;text-transform:uppercase}

/* loading "construyendo tu sistema" */
.mk-ld{background:#f4f7f9;align-items:center;justify-content:center;text-align:center;gap:0;padding:30px}
.mk-ld .orb{width:104px;height:104px;position:relative;margin-bottom:24px}
.mk-ld .orb .core{position:absolute;inset:11px;border-radius:50%;background:var(--blue-dark);display:grid;place-items:center}
.mk-ld .orb svg.ring{position:absolute;inset:0}
.mk-ld h3{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:-.01em}

/* =========================================================================
   4 · CONSTRUCCIÓN DEL MAPA
   ========================================================================= */
const NS='http://www.w3.org/2000/svg';
const pathBase=document.getElementById('pathBase');
const pathDone=document.getElementById('pathDone');
const stationsG=document.getElementById('stations');
const marker=document.getElementById('marker');
const cam=document.getElementById('mapCam');
const mapLayer=document.getElementById('mapLayer');

function smoothPath(pts,tension){
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    const c1x=p1.x+(p2.x-p0.x)/6*tension, c1y=p1.y+(p2.y-p0.y)/6*tension;
    const c2x=p2.x-(p3.x-p1.x)/6*tension, c2y=p2.y-(p3.y-p1.y)/6*tension;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x} ${p2.y}`;
  }
  return d;
}
const D=smoothPath(PT,1);
pathBase.setAttribute('d',D);
pathDone.setAttribute('d',D);

/* largo del camino hasta cada estación (muestreo sobre el path real) */
const TOTAL=pathDone.getTotalLength();
const STOP_LEN=PT.map(g=>{
  let best=0,bd=Infinity;
  for(let l=0;l<=TOTAL;l+=2){
    const p=pathDone.getPointAtLength(l);
    const dd=(p.x-g.x)**2+(p.y-g.y)**2;
    if(dd<bd){bd=dd;best=l}
  }
  return best;
});
pathDone.style.strokeDasharray=TOTAL+' '+TOTAL;
pathDone.style.strokeDashoffset=TOTAL;

/* patrón punteado que llega solo hasta `len` y después corta */
function dottedTo(len){
  const pairs=Math.max(0,Math.floor(len/18));
  const a=[];
  for(let i=0;i<pairs;i++) a.push(2,16);
  a.push(0,TOTAL+80);
  return a.join(' ');
}

/* punto de partida: no es un paso, es dónde está parado hoy */
const og=document.createElementNS(NS,'g');
og.setAttribute('class','origin');
og.setAttribute('transform',`translate(${PT[0].x},${PT[0].y})`);
og.innerHTML=`<circle r="13"></circle><text y="46">${ORIGEN.label}</text>`;
stationsG.appendChild(og);

/* nodos */
STATIONS.forEach((s,i)=>{
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class','st');
  g.setAttribute('transform',`translate(${PT[i+1].x},${PT[i+1].y})`);
  g.innerHTML=
    `<circle class="halo" r="62"></circle>`+
    `<circle class="disc" r="46"></circle>`+

    `<text class="num" y="92">${String(s.n).padStart(2,'0')}</text>`+
    `<text class="lab" y="126">${s.label}</text>`;
  stationsG.appendChild(g);
});
const stEls=[...stationsG.querySelectorAll('.st')];

/* Mini Nico: si el PNG existe, reemplaza al placeholder */
const mnImg=document.getElementById('mini-nico');
mnImg.addEventListener('load',()=>marker.classList.add('has-img'));
mnImg.addEventListener('error',()=>marker.classList.remove('has-img'));

const VBTOP=170, MAPH=450;                          // origen del viewBox y alto de la banda
let currentStation=0, allDone=false;

function renderMap(){
  stEls.forEach((el,i)=>{
    const n=i+1;
    el.classList.remove('locked','done','current');
    if(allDone){ el.classList.add('done'); if(n===3) el.classList.add('current'); }
    else if(n<currentStation) el.classList.add('done');
    else if(n===currentStation) el.classList.add('current');
    else el.classList.add('locked');
  });
  const len=allDone?TOTAL:STOP_LEN[currentStation];
  pathDone.style.strokeDashoffset=TOTAL-len;
  pathBase.style.strokeDasharray=dottedTo(TOTAL);

  /* cámara: encuadra el mapa entero (con 3 estaciones no hace falta esconder nada) */
  const PADX=92, HEAD=214, FOOT=152;                  // aire, marcador arriba, etiquetas abajo
  const x0=PT[0].x-PADX, x1=PT[3].x+PADX;
  const yTop=Math.min(...PT.map(g=>g.y+VBTOP))-HEAD;
  const yBot=Math.max(...PT.map(g=>g.y+VBTOP))+FOOT;
  const k=Math.min(1.2, 1800/(x1-x0), MAPH/(yBot-yTop));
  const tx=-k*x0;
  const ty=(MAPH-k*(yBot-yTop))/2-k*yTop;
  cam.style.transform=`translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${k.toFixed(3)})`;

  const g=PT[currentStation];
  const x=allDone?g.x+52:g.x;
  const y=allDone?g.y-20:g.y;
  const lift=currentStation===0?34:66;                // el origen es chico, el marcador baja
  marker.style.transform=`translate(${(x-56).toFixed(1)}px, ${(y+VBTOP-lift-138).toFixed(1)}px)`;
}

/* ---------- arrastrar una imagen sobre cualquier marco y que quede pegada ----------
   Resuelve el QR sin carpetas ni archivos: soltás el PNG encima y se guarda en el
   navegador. Shift+clic sobre un marco lo vuelve a vaciar. ------------------------- */
const imgKey=src=>'nfm_1pct_img_'+src;

document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());

document.querySelectorAll('.frame[data-src]').forEach(f=>{
  const im=f.querySelector('img');
  try{ const guardada=localStorage.getItem(imgKey(f.dataset.src)); if(guardada) im.src=guardada; }catch(e){}

  f.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();f.classList.add('drop')});
  f.addEventListener('dragleave',()=>f.classList.remove('drop'));
  f.addEventListener('drop',e=>{
    e.preventDefault(); e.stopPropagation(); f.classList.remove('drop');
    const file=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!file||!file.type.startsWith('image/')) return;
    const r=new FileReader();
    r.onload=()=>{
      im.src=r.result;
      try{ localStorage.setItem(imgKey(f.dataset.src),r.result); }
      catch(err){ alert('La imagen entra pero pesa demasiado para guardarla.\nSe ve ahora; al refrescar se pierde.\nProbá con una más liviana.'); }
    };
    r.readAsDataURL(file);
  });
  f.addEventListener('click',e=>{
    if(!e.shiftKey) return;
    e.stopPropagation();
    try{ localStorage.removeItem(imgKey(f.dataset.src)); }catch(err){}
    location.reload();
  });
});

let notesWin=null;

function notesFor(def){
  if(def.type==='node'){
    const sub=STATIONS[def.station-1].subs[def.sub];

}

function updateNotes(){
  if(!notesWin||notesWin.closed) return;

  const def=SLIDES[idx], n=notesFor(def);

/* =========================================================================
   6 · NAVEGACIÓN
   ========================================================================= */
const counter=document.getElementById('counter');
let idx=0, beat=0;

function beatsOf(i){return SLIDES[i].beats||1}

function render(){
  const def=SLIDES[idx];
  slideEls.forEach((el,i)=>el.classList.toggle('on',i===idx));

  const usesMap=['intro','node','close'].includes(def.type);
  mapLayer.classList.toggle('on',usesMap);
  mapLayer.classList.toggle('hero',def.type==='intro'||def.type==='close');

  if(def.station!==undefined){ currentStation=def.station; allDone=!!def.allDone; renderMap(); }

  /* beats del nodo 8: primero la puerta grande, después la chica */
  counter.textContent=String(idx+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');
  counter.classList.toggle('light',def.type==='qualify');
  updateNotes();
  try{localStorage.setItem('nfm_1pct_slide',JSON.stringify({idx,beat}))}catch(e){}
}
function next(){
  if(beat<beatsOf(idx)-1){beat++;render();return}
  if(idx<SLIDES.length-1){idx++;beat=0;render()}
}
function prev(){
  if(beat>0){beat--;render();return}
  if(idx>0){idx--;beat=beatsOf(idx)-1;render()}
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if(e.key==='n'||e.key==='N'){toggleNotes()}
  else if(e.key==='Home'){idx=0;beat=0;render()}
});
document.addEventListener('click',e=>{ if(!e.target.closest('a')) next() });

/* escalado a 1920×1080 */
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  document.getElementById('canvas').style.transform='scale('+s+')';
}
addEventListener('resize',fit);

/* cursor que se esconde */
let ct;
function pokeCursor(){
  document.body.classList.remove('hide-cursor');
  clearTimeout(ct);
  ct=setTimeout(()=>document.body.classList.add('hide-cursor'),3000);
}
addEventListener('mousemove',pokeCursor);

/* arranque */
try{
  const saved=JSON.parse(localStorage.getItem('nfm_1pct_slide')||'null');
  if(saved&&typeof saved.idx==='number'&&saved.idx<SLIDES.length){idx=saved.idx;beat=Math.min(saved.beat||0,beatsOf(idx)-1)}
}catch(e){}
fit();render();pokeCursor();
