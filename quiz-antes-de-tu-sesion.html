<title>Antes de tu sesión · 10 minutos con vos</title>
<meta name="description" content="Un ejercicio corto de introspección para llegar a tu sesión con claridad sobre lo que realmente querés resolver.">

<style>
/* =========================================================================
   ANTES DE TU SESIÓN · ejercicio previo a la llamada
   Pensado mobile-first: una sola cosa por pantalla, tipografía grande,
   botones grandes y el CTA siempre fijo abajo.
   Lo editable está en el bloque CONFIG (dentro del <script>).
   ========================================================================= */
:root{
  --navy:#0c3452; --navyd:#061d30;
  --orange:#ff6602; --ohi:#ff8124; --otxt:#c04a00; --owash:#fff7f2;
  --muted:#33536b; --grey:#5c7286;
  --hair:rgba(12,52,82,.10); --hair2:rgba(12,52,82,.18);
  --head:'Montserrat',sans-serif; --body:'Open Sans',sans-serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --navh:88px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--navy);background:#fbfcfd;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--head)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%, rgba(255,102,2,.07), transparent 55%),
             radial-gradient(90% 60% at 0% 100%, rgba(12,52,82,.05), transparent 60%)}

/* ── progreso ── */
.bar{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(12,52,82,.09);z-index:60}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--ohi));transition:width .45s var(--ease)}
.step-n{position:fixed;top:16px;right:16px;z-index:60;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}

/* ── escenario ── */
.stage{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;padding:56px 18px calc(var(--navh) + 20px)}
.card{width:100%;max-width:620px;margin:auto}
/* la animacion va en un envoltorio interno, NO en .card: un transform (aunque sea
   identidad) convierte al elemento en bloque contenedor y el .nav fijo se pegaria
   al borde de la tarjeta en vez de al del viewport, tapando el contenido */
.anim{animation:in .4s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.k{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--otxt);background:var(--owash);border:1px solid rgba(255,102,2,.24);padding:8px 15px;border-radius:100px;margin-bottom:20px}
.q{font-family:var(--head);font-weight:800;font-size:clamp(25px,6.6vw,34px);line-height:1.18;letter-spacing:-.022em;margin-bottom:14px;text-wrap:balance}
.q .hl{color:var(--orange)}
.hint{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:26px}

/* ── texto libre ── */
.ta{width:100%;min-height:170px;border:2px solid var(--hair2);border-radius:16px;padding:18px;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--navy);background:#fff;resize:vertical;transition:border-color .18s,box-shadow .18s}
.ta::placeholder{color:#9db0c0}
.ta:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,102,2,.13)}
.count{margin-top:9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}

/* ── opciones ── */
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;text-align:left;background:#fff;border:2px solid var(--hair2);border-radius:15px;padding:16px 18px;cursor:pointer;font-family:var(--body);font-size:16.5px;line-height:1.4;color:var(--muted);transition:all .16s var(--ease)}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:rgba(255,102,2,.5)}
.opt.on{border-color:var(--orange);background:var(--owash);color:var(--navy);font-weight:600}
.opt .r{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid rgba(12,52,82,.25);background:#fff;transition:all .16s}
.opt.on .r{border-color:var(--orange);border-width:7px}

/* ── escala ── */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.sc{aspect-ratio:1;border:2px solid var(--hair2);border-radius:14px;background:#fff;font-family:var(--head);font-weight:800;font-size:19px;color:var(--muted);cursor:pointer;transition:all .16s var(--ease);padding:0}
.sc:active{transform:scale(.95)}
.sc.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 10px 22px -8px rgba(255,102,2,.6)}
.scale-lbl{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}

/* ── navegación fija abajo ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;gap:12px;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:rgba(251,252,253,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--hair)}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--head);font-weight:800;font-size:18px;min-height:58px;padding:16px 24px;border-radius:14px;border:none;cursor:pointer;background:var(--orange);color:#fff;box-shadow:0 12px 28px -10px rgba(255,102,2,.65);transition:all .18s var(--ease)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:hover:not(:disabled){background:var(--ohi)}
.btn:disabled{opacity:.34;cursor:not-allowed;box-shadow:none}
.btn .ar{transition:transform .18s var(--ease)}
.btn:hover:not(:disabled) .ar{transform:translateX(4px)}
.back{flex:0 0 auto;background:none;border:2px solid var(--hair2);border-radius:14px;min-height:58px;width:58px;font-size:20px;color:var(--grey);cursor:pointer}
.back:hover{color:var(--navy);border-color:var(--navy)}

/* ── argumentos ── */
.arg .q{font-size:clamp(23px,6vw,31px)}
.arg .body{font-size:16.5px;color:var(--muted);line-height:1.68}
.arg .body p+p{margin-top:15px}
.arg .body b{color:var(--navy)}
.pull{margin-top:22px;padding:18px 20px;border-left:4px solid var(--orange);background:var(--owash);border-radius:0 14px 14px 0}
.pull p{font-family:var(--head);font-weight:700;font-size:16.5px;line-height:1.45;color:var(--navy)}

/* ── Pierina ── */
.pier{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.pier img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:75% 45%;flex:0 0 auto;border:3px solid #fff;box-shadow:0 10px 26px -8px rgba(12,52,82,.35),0 0 0 3px rgba(255,102,2,.25)}
.pier .n{font-family:var(--head);font-weight:800;font-size:18px;line-height:1.2}
.pier .r{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--otxt);margin-top:4px;line-height:1.5}
.pier .b{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5}

/* ── casos ── */
.cases{display:grid;gap:16px}
.case{background:#fff;border:1px solid var(--hair);border-radius:18px;overflow:hidden;box-shadow:0 16px 38px -22px rgba(12,52,82,.35)}
.case__v{position:relative;aspect-ratio:16/9;background:var(--navyd);cursor:pointer;overflow:hidden}
.case__v img{width:100%;height:100%;object-fit:cover}
.case__v::after{content:"";position:absolute;inset:0;background:rgba(12,52,82,.24)}
.case__p{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 12px 28px -6px rgba(255,102,2,.65)}
.case__p svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.case__v iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3}
.case__b{padding:18px 20px 20px}
.case__n{font-family:var(--head);font-weight:800;font-size:19px}
.case__pf{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--otxt);margin:5px 0 14px;line-height:1.5}
.ab{display:grid;gap:11px}
.ab__i{display:flex;gap:11px;align-items:flex-start}
.ab__t{flex:0 0 auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;padding:5px 9px;border-radius:100px;margin-top:2px}
.ab__t--a{background:rgba(12,52,82,.07);color:var(--grey)}
.ab__t--b{background:var(--owash);color:var(--otxt);border:1px solid rgba(255,102,2,.25)}
.ab__x{font-size:14.5px;color:var(--muted);line-height:1.5}
.case__q{margin-top:14px;font-family:var(--head);font-weight:700;font-style:italic;font-size:15px;color:var(--navy);line-height:1.45}

/* ── cierre ── */
.big{font-family:var(--head);font-weight:900;font-size:clamp(27px,7vw,38px);line-height:1.12;letter-spacing:-.025em;margin-bottom:14px}
.big .hl{color:var(--orange)}
.field{margin-top:22px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin-bottom:9px}
.inp{width:100%;min-height:58px;border:2px solid var(--hair2);border-radius:14px;padding:16px 18px;font-family:var(--body);font-size:17px;color:var(--navy);background:#fff;transition:border-color .18s,box-shadow .18s}
.inp:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,102,2,.13)}
.recap{margin-top:22px;background:#fff;border:1px solid var(--hair);border-radius:16px;padding:18px 20px}
.recap h4{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--grey);font-weight:500;margin-bottom:14px}
.recap dl{display:grid;gap:13px}
.recap dt{font-family:var(--head);font-weight:800;font-size:12.5px;color:var(--otxt);line-height:1.35}
.recap dd{font-size:14.5px;color:var(--muted);line-height:1.5;margin-top:3px;white-space:pre-wrap}
.state{margin-top:16px;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;display:none}
.state.on{display:block}
.state.ok{color:#0e6b3a}
.state.err{color:var(--otxt)}
.btn{text-decoration:none}
.btn.off{opacity:.34;pointer-events:none;box-shadow:none}

/* ── desde tablet para arriba ── */
@media(min-width:760px){
  :root{--navh:0px}
  .stage{padding:70px 24px 60px;align-items:center}
  .nav{position:static;background:none;backdrop-filter:none;border-top:0;padding:30px 0 0;justify-content:flex-start}
  .btn{flex:0 0 auto;min-width:230px}
  .scale{grid-template-columns:repeat(10,1fr)}
  .sc{font-size:16px;border-radius:12px}
  .cases{gap:20px}
}
</style>
</head>

         '<p>No hace falta agregar nada nuevo a tu vida. Hace falta ver, con nombre y apellido, cuáles son tus limitaciones de hoy y hacia dónde querés ir. Y de ahí, paso a paso.</p>',
    pull:'No se trata de ir a las corridas. Se trata de que llegues, de que puedas cumplirlo, y de que en el camino se te acomode otra manera de ver las cosas.' },

  { tipo:'texto', id:'situacion', col:'Qué lo disparó',
    k:'Pregunta 1 de 5',
    q:'¿Qué te hizo decir <span class="hl">"necesito ayuda con esto"</span>?',
    hint:'Puede ser algo laboral, personal o de salud. Dos o tres líneas, sin filtro.',
    ph:'Lo que se me viene a la cabeza es…' },

  { tipo:'texto', id:'intentos', col:'Qué ya intentó', wa:'Qué ya intenté',
    k:'Pregunta 2 de 5',
    q:'¿Qué ya intentaste sola/o, y por qué <span class="hl">no te alcanzó</span>?',
    hint:'Cursos, apps, terapia, levantarte más temprano, fuerza de voluntad. Lo que sea que hayas probado.',
    ph:'Probé… y lo que pasó fue…' },

  { tipo:'arg', k:'El cambio de enfoque',
    q:'Lo que mueve la aguja es <span class="hl">una sola cosa</span> a la vez.',
    body:'<p>Casi nadie está estancado por falta de información. Se estanca por tener veinte frentes abiertos y ninguno avanzando.</p>'+
         '<p>Por eso el acompañamiento no suma tareas: <b>saca ruido</b>. Sirve para encontrar lo único que hoy realmente mueve la aguja hacia tu objetivo, y sostener eso hasta que quede instalado.</p>',
    pull:'Enfocarte en lo único que hay que accionar ahora. No en las diez cosas que podrías estar haciendo.' },

  { tipo:'texto', id:'costo', col:'Qué le dolería no resolver', wa:'Qué me dolería no resolver',
    k:'Pregunta 3 de 5',
    q:'Si en 6 meses seguís exactamente igual, ¿qué es lo que más te va a doler <span class="hl">no haber resuelto</span>?',
    hint:'Tomate unos segundos con esta. Suele ser la que más ordena.',
    ph:'Lo que más me dolería es…' },

  { tipo:'escala', id:'urgencia', col:'Urgencia (1-10)',
    k:'Pregunta 4 de 5',
    q:'¿Qué tan urgente sentís que es resolver esto <span class="hl">ahora</span>?',
    hint:'Ahora, no en general.',
    min:'Puede esperar', max:'No aguanta más' },

  { tipo:'opcion', id:'freno', col:'Qué la frenaría', wa:'Qué me podría frenar',
    k:'Pregunta 5 de 5',
    q:'Si mañana te mostraran el paso a paso exacto, ¿qué te frenaría a <span class="hl">decir que sí</span>?',
    hint:'Sé honesta/o. No cambia nada de lo que vamos a hablar: solo hace que lleguemos preparadas.',
    ops:[
      {tx:'El dinero: hoy no lo tengo resuelto', v:'Dinero'},
      {tx:'El tiempo: no sé si puedo sostenerlo', v:'Tiempo'},
      {tx:'Miedo a empezar algo y volver a dejarlo', v:'Miedo a no sostenerlo'},
      {tx:'Lo tengo que hablar con mi pareja o mi familia', v:'Consultarlo con su familia'},
      {tx:'Nada, si me convence arranco', v:'Nada'}
    ]},

  { tipo:'fin' }
];

/* =========================================================================
   MOTOR
   ========================================================================= */
(function(){
  const card  = document.getElementById('card');
  const fill  = document.getElementById('barFill');
  const stepN = document.getElementById('stepN');
  const R = {};
  let i = 0, enviado = false;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const G = CONFIG.GUIA;
  const PREG = PASOS.filter(p => p.id);

  /* nombre desde la URL, si viene (?nombre= o ?invitee_first_name=) */
  function nombreDeUrl(){
    const p = new URLSearchParams(location.search);
    let raw = p.get('nombre') || p.get('invitee_first_name') || p.get('name') || '';
    try{ raw = decodeURIComponent(raw); }catch(e){}
    return raw.trim();
  }
  R.nombre = nombreDeUrl();

  function progreso(){
    fill.style.width = (i/(PASOS.length-1)*100) + '%';
    const p = PASOS[i];
    if(p.tipo === 'intro' || p.tipo === 'fin'){ stepN.textContent = ''; return; }
    const n = PREG.indexOf(p);
    stepN.textContent = n >= 0 ? ((n+1) + ' / ' + PREG.length) : '';
  }

  function nav(txt, off){
    return '<div class="nav">' +
      (i > 0 ? '<button class="back" id="bk" aria-label="Volver">←</button>' : '') +
      '<button class="btn" id="go"' + (off ? ' disabled' : '') + '>' + txt + ' <span class="ar">&rarr;</span></button>' +
    '</div>';
  }

  function pintar(){
    const p = PASOS[i];
    let h = '';

    if(p.tipo === 'intro'){
      h = '<span class="k">Antes de tu sesión</span>' +
        '<h1 class="q">Regalate 10 minutos <span class="hl">con vos</span>.</h1>' +
        '<p class="hint">Esto no es un formulario. Son unas preguntas cortas para que llegues a la sesión sabiendo qué querés resolver — y para que no gastemos la charla construyéndolo desde cero.</p>' +
        '<div class="pier"><img src="' + G.foto + '" alt="' + esc(G.nombre) + '">' +
          '<div><div class="n">' + esc(G.nombre) + '</div><div class="r">' + esc(G.rol) + '</div>' +
          '<div class="b">' + esc(G.bio) + '</div></div></div>' +
        '<p class="hint" style="margin-bottom:0">Pierina también fue alumna: pasó por este mismo camino antes de acompañarlo. Va a leer tus respuestas antes de la llamada.</p>' +
        nav('Empezar');
    }

    else if(p.tipo === 'arg'){
      h = '<div class="arg"><span class="k">' + p.k + '</span>' +
        '<h2 class="q">' + p.q + '</h2>' +
        '<div class="body">' + p.body + '</div>' +
        '<div class="pull"><p>' + p.pull + '</p></div></div>' + nav('Seguir');
    }

    else if(p.tipo === 'texto'){
      const v = R[p.id] || '';
      h = '<span class="k">' + p.k + '</span><h2 class="q">' + p.q + '</h2>' +
        '<p class="hint">' + p.hint + '</p>' +
        '<textarea class="ta" id="ta" placeholder="' + p.ph + '">' + esc(v) + '</textarea>' +
        '<div class="count" id="cnt"></div>' +
        nav('Continuar', v.trim().length < 12);
    }

    else if(p.tipo === 'opcion'){
      h = '<span class="k">' + p.k + '</span><h2 class="q">' + p.q + '</h2>' +
        '<p class="hint">' + p.hint + '</p><div class="opts">' +
        p.ops.map((o,n) => '<button class="opt' + (R[p.id] === o.v ? ' on' : '') + '" data-n="' + n + '">' +
          '<span class="r"></span><span>' + o.tx + '</span></button>').join('') +
        '</div>' + nav('Continuar', R[p.id] == null);
    }

    else if(p.tipo === 'escala'){
      let sc = '';
      for(let n=1;n<=10;n++) sc += '<button class="sc' + (R[p.id] === n ? ' on' : '') + '" data-n="' + n + '">' + n + '</button>';
      h = '<span class="k">' + p.k + '</span><h2 class="q">' + p.q + '</h2>' +
        '<p class="hint">' + p.hint + '</p><div class="scale">' + sc + '</div>' +
        '<div class="scale-lbl"><span>1 · ' + p.min + '</span><span>10 · ' + p.max + '</span></div>' +
        nav('Continuar', R[p.id] == null);
    }

    else if(p.tipo === 'casos'){
      const tres = elegirCasos();
      h = '<span class="k">Ya lo hicieron</span>' +
        '<h2 class="q">Tres personas que arrancaron <span class="hl">parecido a vos</span></h2>' +
        '<p class="hint">Elegidos por tu perfil, tu contexto y lo que hoy te pesa. Tocá el video si querés escucharlos contarlo.</p>' +
        '<div class="cases">' + tres.map(c =>
          '<article class="case"><div class="case__v" data-yt="' + c.yt + '">' +
            '<img src="https://img.youtube.com/vi/' + c.yt + '/hqdefault.jpg" alt="Entrevista a ' + esc(c.nombre) + '" loading="lazy">' +
            '<span class="case__p"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span></div>' +
            '<div class="case__b"><div class="case__n">' + esc(c.nombre) + '</div>' +
            '<div class="case__pf">' + esc(c.perfil) + '</div><div class="ab">' +
              '<div class="ab__i"><span class="ab__t ab__t--a">Antes</span><span class="ab__x">' + esc(c.a) + '</span></div>' +
              '<div class="ab__i"><span class="ab__t ab__t--b">Después</span><span class="ab__x">' + esc(c.b) + '</span></div>' +
            '</div><p class="case__q">' + esc(c.f) + '</p></div></article>').join('') +
        '</div>' + nav('Seguir');
    }

    else if(p.tipo === 'fin'){
      h = '<span class="k">Último paso</span>' +
        '<h2 class="big">Ya hiciste <span class="hl">la parte difícil</span>.</h2>' +
        '<p class="hint">Con esto Pierina llega a la sesión sabiendo de dónde venís. En la llamada te va a devolver qué ve en tus respuestas y cuál es el paso que de verdad te conviene dar ahora — puede que no sea el que estás pensando.</p>' +
        '<div class="field"><label for="nom">¿Cómo te llamás?</label>' +
          '<input class="inp" id="nom" type="text" autocomplete="name" placeholder="Tu nombre" value="' + esc(R.nombre || '') + '"></div>' +
        '<div class="recap"><h4>Lo que respondiste</h4><dl>' +
          PREG.filter(s => R[s.id] != null).map(s =>
            '<div><dt>' + esc(etiq(s)) + '</dt><dd>' + esc(textoDe(s)) + '</dd></div>').join('') +
        '</dl></div>' +
        '<div class="state" id="st"></div>' +
        '<div class="nav"><button class="back" id="bk" aria-label="Volver">←</button>' +
        '<a class="btn' + (R.nombre ? '' : ' off') + '" id="go" target="_blank" rel="noopener">' +
        'Enviar mis respuestas <span class="ar">&rarr;</span></a></div>';
    }

    card.innerHTML = h;

    /* el .nav queda como hijo directo de .card (sin transform encima) para que
       position:fixed se resuelva contra el viewport en celular */
    const nv = card.querySelector('.nav');
    const anim = document.createElement('div');
    anim.className = 'anim';
    while(card.firstChild && card.firstChild !== nv) anim.appendChild(card.firstChild);
    card.insertBefore(anim, nv);
    anim.style.animation = 'none'; void anim.offsetWidth; anim.style.animation = '';
    window.scrollTo(0,0);
    progreso();
    enganchar();
  }

  /* col = encabezado de la planilla (lo lee Pierina) · wa = como lo lee la persona */
  function etiq(s){ return s.wa || s.col; }

  function textoDe(s){
    const v = R[s.id];
    if(s.tipo === 'opcion'){ const o = s.ops.find(x => x.v === v); return o ? o.tx : String(v); }
    if(s.tipo === 'escala') return v + ' de 10';
    return v;
  }

  /* match por perfil profesional + contexto + dolor */
  function elegirCasos(){
    const gen = (R.contexto === 'madre' || R.contexto === 'mujer') ? 'F' : 'M';
    const esPadre = (R.contexto === 'madre' || R.contexto === 'padre');
    return CASOS.slice().map(c => {
      let s = 0;
      if(c.dom === R.dolor) s += 12;
      if(c.tags.indexOf(R.perfil) > -1) s += 9;
      if(c.g === gen) s += 6;
      if(esPadre && c.madre) s += 4;
      return {c:c, s:s + Math.random()};
    }).sort((x,y) => y.s - x.s).slice(0,3).map(x => x.c);
  }

  function enganchar(){
    const p = PASOS[i];
    const go = document.getElementById('go');
    const bk = document.getElementById('bk');
    if(bk) bk.onclick = () => { i--; pintar(); };

    if(p.tipo === 'texto'){
      const ta = document.getElementById('ta'), cnt = document.getElementById('cnt');
      const refrescar = () => {
        R[p.id] = ta.value;
        const n = ta.value.trim().length;
        go.disabled = n < 12;
        cnt.textContent = n < 12 ? 'Escribí un poco más para continuar' : '';
      };
      ta.addEventListener('input', refrescar);
      refrescar();
    }

    if(p.tipo === 'opcion'){
      card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        card.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        R[p.id] = p.ops[+b.dataset.n].v;
        go.disabled = false;
      });
    }

    if(p.tipo === 'escala'){
      card.querySelectorAll('.sc').forEach(b => b.onclick = () => {
        card.querySelectorAll('.sc').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        R[p.id] = +b.dataset.n;
        go.disabled = false;
      });
    }

    if(p.tipo === 'casos'){
      card.querySelectorAll('.case__v').forEach(v => v.onclick = () => {
        if(v.dataset.on) return;
        v.dataset.on = '1';
        v.innerHTML = '<iframe src="https://www.youtube.com/embed/' + v.dataset.yt +
          '?autoplay=1&rel=0" title="Caso de éxito" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      });
    }

    if(p.tipo === 'fin'){
      const nom = document.getElementById('nom');
      const refrescar = () => {
        R.nombre = nom.value;
        const listo = nom.value.trim().length >= 2;
        go.classList.toggle('off', !listo);
        /* sin nombre no hay href: asi el link tampoco se activa con Enter */
        if(listo) go.href = enlaceWhatsapp(); else go.removeAttribute('href');
      };
      nom.addEventListener('input', refrescar);
      nom.addEventListener('change', refrescar);   /* autocompletar del celular */
      refrescar();
      /* el link abre WhatsApp solo; nosotros aprovechamos el clic
         para mandar las respuestas al Sheets en segundo plano */
      go.addEventListener('click', alEnviar);
      return;
    }

    if(go) go.onclick = () => { if(!go.disabled){ i++; pintar(); } };
  }

  /* ── el mensaje que se le manda a Pierina ── */
  function mensaje(){
    return 'Hola Pierina! Soy ' + (R.nombre || '').trim() +
      '. Completé el ejercicio antes de nuestra sesión:\n\n' +
      PREG.filter(s => R[s.id] != null)
          .map(s => '▸ ' + etiq(s) + '\n' + textoDe(s))
          .join('\n\n');
  }

  function enlaceWhatsapp(){
    return 'https://wa.me/' + CONFIG.WHATSAPP + '?text=' + encodeURIComponent(mensaje());
  }

  function estado(clase, txt){
    const st = document.getElementById('st');
    st.className = 'state on ' + clase;
    st.textContent = txt;
  }

  /* ── al tocar el botón: abre WhatsApp (lo hace el propio link) y,
        en paralelo, deja las respuestas en el Google Sheets ── */
  function alEnviar(){
    const nom = document.getElementById('nom');
    R.nombre = (nom.value || '').trim();
    if(R.nombre.length < 2){ nom.focus(); return; }

    estado('ok', '✓ Se abrió WhatsApp — solo tocá enviar');

    if(enviado || !CONFIG.SHEETS_ENDPOINT) return;
    enviado = true;
    const datos = {fecha:new Date().toISOString(), nombre:R.nombre, origen:location.href};
    PREG.forEach(s => { if(R[s.id] != null) datos[s.id] = textoDe(s); });
    try{
      fetch(CONFIG.SHEETS_ENDPOINT, {method:'POST', mode:'no-cors', keepalive:true,
        body:JSON.stringify(datos)}).catch(e => console.warn('sheets:', e));
    }catch(e){ console.warn('sheets:', e); }
  }

  pintar();
})();
</script>
</body>
</html>
