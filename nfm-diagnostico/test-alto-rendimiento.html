<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de Alto Rendimiento — Nicolás Fernández Miranda</title>
<meta name="description" content="Tu diagnóstico de alto rendimiento post-clases: perfil, recomendaciones para tu rutina y tu próximo paso.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta NFM — mezcla estética diagnóstico + landing "escalá tu vida" */
  --bg-1:#0e3a59; --bg-2:#08243c; --bg-3:#04111d;
  --navy:#0c3452; --navy-2:#0a2d47; --navy-line:#13456b;
  --orange:#ff6602; --orange-2:#ff8124; --orange-glow:rgba(255,102,2,0.18);
  --ink:#f3f7fb; --muted:#9fb6c8; --muted-2:#6f8aa1;
  --ok:#22c55e;
  --font-head:'Montserrat',sans-serif;
  --font-body:'Open Sans',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:14px; --radius-lg:20px;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3));
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font-body);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;position:relative;overflow-x:hidden;
}
body::before{content:'';position:fixed;top:-40px;right:-60px;width:340px;height:340px;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='20' y='20' width='140' height='140' rx='2' stroke='%23ff6602' stroke-width='8' fill='none'/%3E%3Crect x='50' y='50' width='100' height='100' rx='2' stroke='%23ff6602' stroke-width='6' fill='none'/%3E%3C/svg%3E");background-size:contain;background-repeat:no-repeat;opacity:0.05;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-60px;left:-40px;width:280px;height:280px;background:radial-gradient(circle,var(--orange-glow),transparent 68%);opacity:0.5;pointer-events:none;z-index:0}

.mono{font-family:var(--font-mono);letter-spacing:0.02em}

/* HEADER */
.nfm-header{width:100%;padding:16px 24px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,0.07);position:relative;z-index:10;background:rgba(6,25,43,0.55);backdrop-filter:blur(8px)}
.nfm-logo img{height:36px;width:auto;display:block;mix-blend-mode:screen}
.nfm-container{width:100%;max-width:680px;padding:40px 24px 90px;position:relative;z-index:1}

/* BADGE */
.nfm-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,102,2,0.12);border:1px solid rgba(255,102,2,0.35);color:var(--orange);font-family:var(--font-mono);font-size:0.66rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:7px 15px;border-radius:100px;margin-bottom:26px}
.nfm-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:nfmPulse 2s ease infinite}

/* INTRO */
.nfm-intro{text-align:center;animation:nfmFadeUp 0.6s ease both}
.nfm-intro h1{font-family:var(--font-head);font-size:clamp(24px,5.4vw,38px);font-weight:900;line-height:1.1;margin-bottom:16px;letter-spacing:-0.02em}
.nfm-intro h1 span{color:var(--orange)}
.nfm-intro-sub{color:var(--muted);font-size:15px;line-height:1.7;max-width:530px;margin:0 auto 26px}
.nfm-intro-sub strong{color:var(--ink);font-weight:600}

.nfm-belief-strip{background:rgba(255,102,2,0.07);border:1px solid rgba(255,102,2,0.22);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:26px;text-align:left;position:relative;overflow:hidden}
.nfm-belief-strip::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--orange)}
.nfm-belief-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:9px}
.nfm-belief-text{font-size:14.5px;line-height:1.65;color:var(--ink)}
.nfm-belief-text em{color:var(--orange-2);font-style:normal;font-weight:700}
.nfm-belief-text strong{font-weight:700}

.nfm-what-you-get{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:28px;text-align:left}
.nfm-what-title{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:13px}
.nfm-what-item{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--muted);margin-bottom:9px;line-height:1.5}
.nfm-what-item:last-child{margin-bottom:0}
.nfm-what-item::before{content:'›';color:var(--orange);font-weight:900;font-size:16px;flex-shrink:0;line-height:1.3}
.nfm-what-item strong{color:var(--ink);font-weight:600}

.nfm-btn-start{background:var(--orange);color:#fff;font-family:var(--font-head);font-size:1rem;font-weight:800;padding:17px 44px;border-radius:100px;border:none;cursor:pointer;transition:var(--transition);box-shadow:0 6px 26px var(--orange-glow)}
.nfm-btn-start:hover{background:#e55a00;transform:translateY(-2px);box-shadow:0 10px 34px rgba(255,102,2,0.4)}
.nfm-time-note{margin-top:14px;color:var(--muted-2);font-size:12px;letter-spacing:0.03em}

/* PROFESIÓN */
.nfm-screen{animation:nfmFadeUp 0.5s ease both}
.nfm-prof-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:12px;text-align:center}
.nfm-prof-title{font-family:var(--font-head);font-size:clamp(19px,4vw,25px);font-weight:900;line-height:1.25;margin-bottom:8px;text-align:center}
.nfm-prof-sub{font-size:14px;color:var(--muted);margin-bottom:26px;line-height:1.6;text-align:center}
.nfm-prof-grid{display:flex;flex-direction:column;gap:10px;text-align:left}
.nfm-prof-card{background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:var(--transition);display:flex;align-items:flex-start;gap:14px}
.nfm-prof-card:hover{border-color:rgba(255,102,2,0.4);background:rgba(255,102,2,0.05)}
.nfm-prof-card.selected{border-color:var(--orange);background:rgba(255,102,2,0.08)}
.nfm-prof-icon{font-size:24px;flex-shrink:0;margin-top:1px}
.nfm-prof-info strong{display:block;font-family:var(--font-head);font-size:14px;font-weight:700;margin-bottom:3px}
.nfm-prof-info span{font-size:12px;color:var(--muted-2);line-height:1.4}

/* PROGRESS */
.nfm-progress-wrap{margin-bottom:26px}
.nfm-progress-meta{display:flex;justify-content:space-between;margin-bottom:8px}
.nfm-progress-label{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--muted-2);letter-spacing:0.1em;text-transform:uppercase}
.nfm-progress-count{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--orange)}
.nfm-progress-track{height:3px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.nfm-progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));border-radius:3px;transition:width 0.4s ease}

/* SECTION CHIP */
.nfm-section-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,102,2,0.1);border:1px solid rgba(255,102,2,0.2);color:var(--orange);font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border-radius:100px;margin-bottom:16px}

/* QUESTION CARD */
.nfm-question-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:30px;position:relative;overflow:hidden}
.nfm-question-card::before{content:'';position:absolute;top:0;right:0;width:40px;height:40px;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M36 4 L4 4 L4 36' stroke='%23ff6602' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-size:contain;opacity:0.4}
.nfm-q-num{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px}
.nfm-q-frame{background:rgba(255,102,2,0.06);border-left:3px solid var(--orange);padding:13px 15px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.68;color:var(--muted);margin-bottom:18px}
.nfm-q-frame strong{color:var(--ink);font-weight:700}
.nfm-q-frame em{color:var(--orange-2);font-style:normal;font-weight:600}
.nfm-q-text{font-family:var(--font-head);font-size:clamp(16px,2.8vw,20px);font-weight:700;line-height:1.4;margin-bottom:14px}
.nfm-q-text em{color:var(--orange);font-style:normal}
.nfm-q-subtext{font-size:13.5px;line-height:1.65;color:var(--muted-2);margin-bottom:20px}
.nfm-options{display:flex;flex-direction:column;gap:10px}
.nfm-option{background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:14px 18px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:14px}
.nfm-option:hover{border-color:rgba(255,102,2,0.4);background:rgba(255,102,2,0.05);transform:translateX(4px)}
.nfm-option.selected{border-color:var(--orange);background:rgba(255,102,2,0.08)}
.nfm-option-letter{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted-2);flex-shrink:0;transition:var(--transition)}
.nfm-option.selected .nfm-option-letter{background:var(--orange);border-color:var(--orange);color:#fff}
.nfm-option-text{font-size:14px;line-height:1.5;color:var(--ink)}
.nfm-option-text strong{font-weight:700}
.nfm-option-check{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);position:relative}
.nfm-option.selected .nfm-option-check{background:var(--orange);border-color:var(--orange)}
.nfm-option-check::after{content:'';width:0;height:0;border-style:solid;border-width:0 2px 2px 0;border-color:#fff;transform:rotate(45deg);transition:all 0.2s ease;opacity:0}
.nfm-option.selected .nfm-option-check::after{width:5px;height:9px;opacity:1;margin-bottom:2px}
.nfm-multi-counter{display:inline-flex;align-items:center;gap:8px;background:rgba(255,102,2,0.1);border:1px solid rgba(255,102,2,0.25);color:var(--orange);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:7px 14px;border-radius:100px;margin-bottom:18px;transition:all 0.3s ease}
.nfm-multi-counter strong{color:var(--ink)}
.nfm-multi-counter.has-selection{background:rgba(255,102,2,0.18);border-color:rgba(255,102,2,0.5)}

.nfm-nav{display:flex;justify-content:space-between;margin-top:24px;align-items:center}
.nfm-btn-back{background:transparent;color:var(--muted-2);font-family:var(--font-head);font-size:13px;font-weight:700;padding:13px 18px;border-radius:100px;border:1px solid rgba(255,255,255,0.12);cursor:pointer;transition:var(--transition)}
.nfm-btn-back:hover{color:var(--ink);border-color:rgba(255,255,255,0.3)}
.nfm-btn-next{background:var(--orange);color:#fff;font-family:var(--font-head);font-size:13px;font-weight:800;padding:13px 28px;border-radius:100px;border:none;cursor:pointer;transition:var(--transition);opacity:0;pointer-events:none}
.nfm-btn-next.visible{opacity:1;pointer-events:all;animation:nfmPopIn 0.3s ease both}
.nfm-btn-next:hover{background:#e55a00;transform:translateY(-2px);box-shadow:0 6px 20px var(--orange-glow)}

/* BELIEF (hammer interstitial) */
.nfm-hammer{background:linear-gradient(135deg,rgba(255,102,2,0.13),rgba(10,45,71,0.5));border:1.5px solid rgba(255,102,2,0.4);border-radius:var(--radius-lg);padding:36px 32px;animation:nfmFadeUp 0.5s ease both;text-align:left;position:relative;overflow:hidden}
.nfm-hammer::after{content:'';position:absolute;bottom:-40px;right:-30px;width:180px;height:180px;background:radial-gradient(circle,var(--orange-glow),transparent 70%);pointer-events:none}
.nfm-hammer-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px;position:relative}
.nfm-hammer-text{font-family:var(--font-head);font-size:clamp(18px,3.6vw,23px);font-weight:800;line-height:1.35;color:var(--ink);position:relative}
.nfm-hammer-text em{color:var(--orange);font-style:normal}
.nfm-hammer-sub{font-size:14px;line-height:1.7;color:var(--muted);margin-top:16px;position:relative}
.nfm-hammer-sub strong{color:var(--ink)}
.nfm-hammer-chain{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;position:relative}
.nfm-hammer-chip{background:rgba(255,255,255,0.05);border:1px solid rgba(255,102,2,0.3);color:var(--orange);font-family:var(--font-mono);font-size:11px;padding:6px 11px;border-radius:100px}

/* PUENTE / INSTITUTO */
.nfm-puente{background:linear-gradient(135deg,rgba(255,102,2,0.10),rgba(14,64,96,0.4));border:1.5px solid rgba(255,102,2,0.35);border-radius:var(--radius-lg);padding:32px;animation:nfmFadeUp 0.5s ease both;text-align:left}
.nfm-puente-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px}
.nfm-puente-title{font-family:var(--font-head);font-size:clamp(17px,3.5vw,22px);font-weight:900;margin-bottom:18px;line-height:1.3}
.nfm-puente-text{font-size:14.5px;line-height:1.75;color:var(--muted);margin-bottom:14px}
.nfm-puente-text strong{color:var(--ink);font-weight:700}
.nfm-puente-text.highlight{background:rgba(255,102,2,0.08);border-left:3px solid var(--orange);padding:14px 16px;border-radius:0 8px 8px 0;color:var(--ink);font-weight:600;margin-top:18px}
.nfm-staff-grid{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.nfm-staff-chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--muted-2);font-family:var(--font-mono);font-size:11px;font-weight:400;padding:7px 12px;border-radius:100px;transition:all 0.5s cubic-bezier(0.4,0,0.2,1);opacity:0;transform:translateY(8px) scale(0.95)}
.nfm-staff-chip.shown{opacity:1;transform:translateY(0) scale(1)}
.nfm-staff-chip.core{background:rgba(255,102,2,0.14);border-color:rgba(255,102,2,0.4);color:var(--orange)}
.nfm-staff-chip.highlight{background:rgba(255,102,2,0.18);border-color:rgba(255,102,2,0.6);color:var(--orange);animation:nfmChipPulse 1.8s ease-out 0.2s 1}
@keyframes nfmChipPulse{0%{box-shadow:0 0 0 0 rgba(255,102,2,0.55);transform:scale(1)}50%{transform:scale(1.06)}100%{box-shadow:0 0 0 12px rgba(255,102,2,0);transform:scale(1)}}
.nfm-puente-hint{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--orange);letter-spacing:0.06em;text-transform:uppercase;margin:6px 0 8px;display:flex;align-items:center;gap:6px}
.nfm-puente-hint::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange);animation:nfmPulse 1.8s ease infinite}

/* LOADING */
.nfm-loading{text-align:center;padding:60px 20px;animation:nfmFadeUp 0.4s ease both}
.nfm-loading-ring{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,102,2,0.15);border-top-color:var(--orange);animation:nfmSpin 0.9s linear infinite;margin:0 auto 24px}
.nfm-loading h3{font-family:var(--font-head);font-size:20px;font-weight:800;margin-bottom:8px}
.nfm-loading p{color:var(--muted-2);font-size:13px}
.nfm-loading-steps{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.nfm-loading-step{font-family:var(--font-mono);font-size:12px;color:var(--muted-2);opacity:0.4;transition:opacity 0.5s ease,color 0.5s ease}
.nfm-loading-step.active{color:var(--orange);opacity:1}

/* RESULT */
.nfm-results{animation:nfmFadeUp 0.6s ease both}
.nfm-result-header{text-align:center;margin-bottom:24px;padding:32px;border-radius:var(--radius-lg);position:relative;overflow:hidden;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)}
.nfm-result-header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,102,2,0.10),transparent 60%);pointer-events:none}
.nfm-pct-ring{position:relative;display:inline-block;margin-bottom:14px}
.nfm-pct-svg{transform:rotate(-90deg)}
.nfm-pct-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:6}
.nfm-pct-fill{fill:none;stroke:var(--orange);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1)}
.nfm-pct-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.nfm-pct-num{font-family:var(--font-head);font-size:24px;font-weight:900;line-height:1}
.nfm-pct-sub{font-family:var(--font-mono);font-size:8px;font-weight:400;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.1em;margin-top:4px}
.nfm-result-profile-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,102,2,0.12);border:1px solid rgba(255,102,2,0.35);color:var(--orange);font-family:var(--font-mono);font-size:0.66rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:6px 14px;border-radius:100px;margin-bottom:14px}
.nfm-result-title{font-family:var(--font-head);font-size:clamp(20px,4vw,28px);font-weight:900;margin-bottom:14px;line-height:1.25}
.nfm-result-title span{color:var(--orange)}
.nfm-result-desc{font-size:14px;line-height:1.75;color:var(--muted);max-width:520px;margin:0 auto;text-align:left}
.nfm-result-desc strong{color:var(--ink)}
.nfm-section-title{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.1em;margin:26px 0 14px}

/* RESUMEN 2 CLASES */
.nfm-resumen{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:22px 24px}
.nfm-resumen-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.nfm-resumen-item:last-child{border-bottom:none}
.nfm-resumen-ico{font-size:18px;flex-shrink:0;margin-top:1px}
.nfm-resumen-item strong{display:block;font-family:var(--font-head);font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:3px}
.nfm-resumen-item span{font-size:12.5px;line-height:1.6;color:var(--muted-2)}

/* RECOMENDACIONES */
.nfm-reco-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden}
.nfm-reco-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--orange);opacity:0.5}
.nfm-reco-num{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--orange);background:rgba(255,102,2,0.1);border:1px solid rgba(255,102,2,0.25);border-radius:8px;padding:6px 10px;flex-shrink:0;margin-top:1px}
.nfm-reco-content strong{display:block;font-family:var(--font-head);font-size:14px;font-weight:800;color:var(--ink);margin-bottom:5px;line-height:1.3}
.nfm-reco-content p{font-size:13px;line-height:1.7;color:var(--muted)}

/* PROYECCIÓN + ENCUADRE */
.nfm-proyeccion{background:rgba(255,102,2,0.06);border:1px solid rgba(255,102,2,0.25);border-radius:var(--radius-lg);padding:24px;margin:24px 0;text-align:left}
.nfm-proyeccion-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px}
.nfm-proyeccion-text{font-family:var(--font-head);font-size:clamp(15px,3vw,18px);font-weight:700;line-height:1.45;color:var(--ink)}
.nfm-proyeccion-text em{color:var(--orange);font-style:normal;font-weight:800}
.nfm-encuadre{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-lg);padding:26px;margin:24px 0;text-align:center;position:relative;overflow:hidden}
.nfm-encuadre::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,102,2,0.08),transparent 65%);pointer-events:none}
.nfm-encuadre-eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;position:relative}
.nfm-encuadre-text{font-family:var(--font-head);font-size:clamp(16px,3.2vw,20px);font-weight:800;line-height:1.38;margin-bottom:8px;position:relative;color:var(--ink)}
.nfm-encuadre-text em{color:var(--orange);font-style:normal}
.nfm-encuadre-sub{font-size:13px;line-height:1.7;color:var(--muted);position:relative}
.nfm-divider{height:1px;background:rgba(255,255,255,0.06);margin:24px 0}

/* OFFER / CTA */
.nfm-offer-card{border-radius:var(--radius-lg);padding:28px;margin-bottom:12px;position:relative;overflow:hidden}
.nfm-offer-card.llamada{background:linear-gradient(135deg,rgba(255,102,2,0.12),rgba(14,64,96,0.4));border:1.5px solid rgba(255,102,2,0.4)}
.nfm-offer-card.libro-honesto{background:linear-gradient(135deg,rgba(255,102,2,0.08),rgba(14,64,96,0.3));border:1.5px solid rgba(255,102,2,0.3)}
.nfm-offer-card.libro-suave{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12)}
.nfm-offer-tag{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--orange);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.nfm-offer-name{font-family:var(--font-head);font-size:clamp(17px,3.5vw,22px);font-weight:900;margin-bottom:14px;line-height:1.3;color:var(--ink)}
.nfm-offer-desc{font-size:14px;line-height:1.75;color:var(--muted);margin-bottom:14px}
.nfm-offer-desc strong{color:var(--ink)}
.nfm-video-section{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);overflow:hidden;margin:20px 0}
.nfm-video-iframe-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden}
.nfm-video-iframe-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.nfm-btn-cta-primary{width:100%;background:var(--orange);color:#fff;font-family:var(--font-head);font-size:15px;font-weight:800;padding:17px 24px;border-radius:100px;border:none;cursor:pointer;transition:var(--transition);box-shadow:0 4px 20px var(--orange-glow);margin-bottom:10px}
.nfm-btn-cta-primary:hover{background:#e55a00;transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,102,2,0.45)}
.nfm-cta-foot{text-align:center;margin-top:8px;font-size:11px;color:var(--muted-2);letter-spacing:0.02em}
.nfm-firma{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.07);font-size:13px;line-height:1.7;color:var(--muted-2)}
.nfm-firma strong{color:var(--ink);font-weight:700}
.nfm-libro-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.nfm-libro-chip{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:7px 13px;font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted)}
.nfm-libro-chip.orange{background:rgba(255,102,2,0.1);border-color:rgba(255,102,2,0.25);color:var(--orange)}
.nfm-trust-row{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px;margin-top:32px;padding:18px;background:rgba(255,255,255,0.02);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.05)}
.nfm-trust-item{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted-2)}

/* ANIMATIONS */
@keyframes nfmFadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes nfmPopIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
@keyframes nfmPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.85)}}
@keyframes nfmSpin{to{transform:rotate(360deg)}}
@media (max-width:520px){
  .nfm-container{padding:30px 18px 70px}
  .nfm-question-card,.nfm-puente,.nfm-offer-card,.nfm-result-header,.nfm-hammer{padding:22px}
  .nfm-btn-start{padding:15px 32px;font-size:14px}
}
</style>

/* ═══════════════════ ESTADO ═══════════════════ */
let stepIdx = 0;            // índice en el "runtime" de pantallas
let profession = null;
let selected = null;         // single: índice; multi: array
let answers = {};            // flowIndex → respuesta
let scores = { acuerdo:0, aplicacion:0, saturacion:0 };

let costoTags = [];
let inversorTag = null;
let capacidadTag = null;

/* runtime = intro, prof, [flow...], cal1, cal2, loading, result */
const PRE = ['intro','prof'];
const POST = ['cal1','cal2','loading','result'];
function totalRuntime(){ return PRE.length + flow.length + POST.length; }
function nodeAt(i){
  if(i < PRE.length) return { type:PRE[i] };
  if(i < PRE.length + flow.length) return { type:'flow', flowIdx:i - PRE.length };
  return { type:POST[i - PRE.length - flow.length] };
}
/* progreso: contamos solo pasos "interactivos" (flow que no es belief + cal1 + cal2) */
function progressInfo(){
  const interactive = [];
  flow.forEach((f,idx)=>{ if(f.kind!=='belief') interactive.push(PRE.length+idx); });
  interactive.push(PRE.length+flow.length);     // cal1
  interactive.push(PRE.length+flow.length+1);   // cal2
  const done = interactive.filter(gi => gi < stepIdx).length;
  const cur = interactive.indexOf(stepIdx);
  const shownNum = cur >= 0 ? cur+1 : done;
  return { total:interactive.length, num:Math.max(1,shownNum), pct:Math.round((done + (cur>=0?1:0))/interactive.length*100) };
}

/* ═══════════════════ HELPERS ═══════════════════ */
function isStudent(){ return profession === 'student'; }
function fEl(f, base){ return f.personal ? f[base+'_'+profession] : f[base]; }

function getProfileKey(){
  const { acuerdo, aplicacion, saturacion } = scores;
  if(saturacion >= 11 && saturacion >= acuerdo) return 'saturado';
  if(aplicacion >= 8) return 'cerro_circulo';
  if(acuerdo >= 16) return 'avatar';
  return 'espera_momento';
}
function getPct(){
  const key = getProfileKey();
  const range = profiles[key].pct;
  const max = 28;                              // acuerdo máximo aprox (9 pasos ~3)
  const norm = Math.min(1, scores.acuerdo / max);
  return Math.round(range[0] + norm * (range[1]-range[0]));
}
/* Ruteo: el que acuerda + puede + quiere → llamada (avatar). Resto → libro. */
function getCamino(){
  if(isStudent()) return 'B';
  if(inversorTag === 'inversor_no') return 'C';
  if(inversorTag === 'inversor_dudoso') return 'B';
  if(capacidadTag === 'capacidad_si' || capacidadTag === 'capacidad_ajustada') return 'A';
  return 'B';
}

/* ═══════════════════ RENDER ═══════════════════ */
function render(){
  const app = document.getElementById('app');
  const node = nodeAt(stepIdx);
  if(node.type==='intro')        app.innerHTML = renderIntro();
  else if(node.type==='prof')    app.innerHTML = renderProf();
  else if(node.type==='flow'){
    const f = flow[node.flowIdx];
    if(f.kind==='belief')        app.innerHTML = renderBelief(f);
    else if(f.kind==='puente'){  app.innerHTML = renderPuente(); animatePuenteChips(); }
    else                         app.innerHTML = renderQuestion(f, node.flowIdx);
  }
  else if(node.type==='cal1')    app.innerHTML = renderCal1();
  else if(node.type==='cal2')    app.innerHTML = renderCal2();
  else if(node.type==='loading'){app.innerHTML = renderLoading(); runLoading(); }
  else if(node.type==='result'){ app.innerHTML = renderResult(); animateResult(); }
  window.scrollTo({top:0, behavior:'smooth'});
}

function runLoading(){
  const steps=['ls1','ls2','ls3','ls4']; let i=0;
  const iv=setInterval(()=>{
    i++;
    if(i<steps.length){
      document.querySelectorAll('.nfm-loading-step').forEach(el=>el.classList.remove('active'));
      const el=document.getElementById(steps[i]); if(el) el.classList.add('active');
    }
    if(i>=steps.length-1){ clearInterval(iv); setTimeout(()=>{ stepIdx++; render(); },900); }
  },700);
}

/* ═══════════════════ ACCIONES / NAV ═══════════════════ */
function selectProf(id){ profession=id; render(); }
function pickOpt(i){ selected=i; render(); }
function toggleOpt(i){
  if(!Array.isArray(selected)) selected=[];
  const idx=selected.indexOf(i);
  if(idx>=0) selected.splice(idx,1); else selected.push(i);
  render();
}
function setInversor(tag){ inversorTag=tag; render(); }
function setCapacidad(tag,idx){ capacidadTag=tag; cal2Idx=idx; render(); }

function next(){
  const node = nodeAt(stepIdx);
  /* validaciones */
  if(node.type==='prof' && !profession) return;
  if(node.type==='cal1' && !inversorTag) return;
  if(node.type==='cal2' && !capacidadTag) return;

  if(node.type==='flow'){
    const f = flow[node.flowIdx];
    if(f.kind==='agree'){
      if(selected===null) return;
      answers[node.flowIdx]=selected;
    } else if(f.kind==='multi'){
      if(!Array.isArray(selected)||selected.length===0) return;
      answers[node.flowIdx]=[...selected];
    }
    recompute();
  }

  stepIdx++;
  loadSelectionFor(stepIdx);
  render();
}

function back(){
  if(stepIdx===0) return;
  /* si estamos por entrar a loading/result, no hay back manual desde ahí (no se renderiza) */
  stepIdx--;
  /* saltear pantallas belief/puente hacia atrás también es válido (no guardan estado) */
  loadSelectionFor(stepIdx);
  render();
}

/* prepara `selected` según la respuesta previa guardada del paso actual */
function loadSelectionFor(i){
  const node = nodeAt(i);
  if(node.type==='flow'){
    const f = flow[node.flowIdx];
    if(f.kind==='agree'){ selected = (answers[node.flowIdx]!==undefined)?answers[node.flowIdx]:null; }
    else if(f.kind==='multi'){ selected = (answers[node.flowIdx]!==undefined)?[...answers[node.flowIdx]]:[]; }
    else { selected=null; }
  } else { selected=null; }
}

/* recalcula scores, tags y proyección desde `answers` */
function recompute(){
  scores = { acuerdo:0, aplicacion:0, saturacion:0 };
  frasesSintomaTags=[]; costoTags=[]; proyeccionTexto='';
  flow.forEach((f,idx)=>{
    const a = answers[idx];
    if(a===undefined) return;
    if(f.kind==='agree'){
      const s = f.options[a].score;
      scores.acuerdo+=s[0]; scores.aplicacion+=s[1]; scores.saturacion+=s[2];
    } else if(f.kind==='multi' && !f.isCost){
      /* 7 caras: cuantas más marca, más saturación + reconocimiento (acuerdo) */
      const m = a.length;
      if(m>=5){ scores.saturacion+=4; scores.acuerdo+=3; }
      else if(m>=3){ scores.saturacion+=2; scores.acuerdo+=2; }
      else if(m>=1){ scores.saturacion+=1; scores.acuerdo+=1; }
      const q = f;
      a.forEach(i=>{ if(q.options[i] && q.options[i].tag) frasesSintomaTags.push(q.options[i].tag); });
    } else if(f.kind==='multi' && f.isCost){
      const opts = f['options_'+profession];
      /* reconocer el costo también suma acuerdo (acuerdo 8) */
      scores.acuerdo += Math.min(3, a.length);
      const proys=[];
      a.forEach(i=>{
        if(opts[i]){ if(opts[i].tag) costoTags.push(opts[i].tag); if(opts[i].proyeccion) proys.push(opts[i].proyeccion); }
      });
      if(proys.length===1) proyeccionTexto=proys[0];
      else if(proys.length===2) proyeccionTexto=proys[0]+', y '+proys[1];
      else if(proys.length>2) proyeccionTexto=proys.slice(0,-1).join(', ')+', y '+proys[proys.length-1];
    }
  });
}

function animateResult(){
  const pct=getPct(); const circ=2*Math.PI*38;
  const circle=document.getElementById('pct-circle'); const numEl=document.getElementById('pct-num');
  let cur=0;
  const iv=setInterval(()=>{
    cur=Math.min(cur+2,pct);
    if(numEl) numEl.textContent=cur+'%';
    if(circle) circle.style.strokeDashoffset=circ-(cur/100)*circ;
    if(cur>=pct) clearInterval(iv);
  },20);
}

render();
